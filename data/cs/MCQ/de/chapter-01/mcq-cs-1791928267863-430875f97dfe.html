function initHome(){$("sectionsList").innerHTML="";topicNames.forEach(t=>{let list=questions.filter(q=>q.topic===t),d=document.createElement("div");d.className="section";d.innerHTML=`<div class="section-title">${t}</div><div class="section-count">${list.length} MCQs</div>`;d.onclick=()=>chooseTopic(t);$("sectionsList").appendChild(d)})}
function chooseTopic(t){currentTopic=t;$("setupTitle").textContent=t;let list=questions.filter(q=>q.topic===t);$("setupInfo").textContent=`This topic has ${list.length} questions available.`;let s=$("questionCount");s.innerHTML="";[list.length,Math.min(10,list.length),Math.min(20,list.length),Math.min(30,list.length)].filter((v,i,a)=>v>0&&a.indexOf(v)===i).sort((a,b)=>a-b).forEach(n=>{let o=document.createElement("option");o.value=n;o.textContent=n===list.length?`All ${n} Questions`:`${n} Questions`;s.appendChild(o)});s.value=list.length;show("setup")}
function startPractice(){let n=Number($("questionCount").value);activeQuestions=questions.filter(q=>q.topic===currentTopic).slice(0,n);index=0;answers={};checked={};submitted=false;$("sectionName").textContent=currentTopic;show("quiz");render()}
function render(){let q=activeQuestions[index];if(!q)return;$("counter").textContent=`Question ${index+1} of ${activeQuestions.length}`;$("attempted").textContent=`Answered: ${Object.keys(answers).filter(k=>answers[k]!==4).length} / ${activeQuestions.length}`;$("question").textContent=q.q;let box=$("options");box.innerHTML="";[...q.options,"Question not attempted"].forEach((o,k)=>{let l=document.createElement("button");l.type="button";l.className="option"+(answers[q.id]===k?" selected":"");l.innerHTML=`<b>(${String.fromCharCode(65+k)})</b> ${o}`;l.onclick=()=>{if(submitted)return;answers[q.id]=k;delete checked[q.id];render()};box.appendChild(l)});$("feedback").textContent="";$("explanation").classList.add("hidden");if(checked[q.id]){let ok=answers[q.id]===q.answer;$("feedback").textContent=answers[q.id]===4?"Question marked not attempted":ok?"Correct answer!":"Incorrect answer";$("feedback").style.color=answers[q.id]===4?"#6b7280":ok?"#15803d":"#dc2626";$("explanation").innerHTML=`<div class="explanation-title">Explanation</div>${q.explanation}<br><b>Correct answer:</b> (${String.fromCharCode(65+q.answer)}) ${q.options[q.answer]}`;$("explanation").classList.remove("hidden");[...box.children].forEach((el,k)=>{if(k===q.answer)el.classList.add("correct");if(k===answers[q.id]&&k!==q.answer&&k!==4)el.classList.add("wrong")})}$("prevBtn").disabled=index===0;$("nextBtn").disabled=index===activeQuestions.length-1;renderPalette()}
function renderPalette(){let p=$("palette");p.innerHTML="";activeQuestions.forEach((q,i)=>{let b=document.createElement("button");b.className="pal"+(i===index?" active":"")+(answers[q.id]!==undefined?" done":"");b.textContent=i+1;b.onclick=()=>{index=i;render()};p.appendChild(b)})}
$("prevBtn").onclick=()=>{if(index>0){index--;render()}};$("nextBtn").onclick=()=>{if(index<activeQuestions.length-1){index++;render()}};
$("checkBtn").onclick=()=>{let q=activeQuestions[index];if(answers[q.id]===undefined){$("feedback").textContent="Select an option, or choose (E) Question not attempted.";return}checked[q.id]=true;render()};
$("submitBtn").onclick=()=>{if(!confirm("Submit test?"))return;submitted=true;let c=0,w=0,u=0;activeQuestions.forEach(q=>{if(answers[q.id]===undefined||answers[q.id]===4)u++;else if(answers[q.id]===q.answer)c++;else w++});$("resultText").innerHTML=`Total Questions: ${activeQuestions.length}<br>Correct: ${c}<br>Wrong: ${w}<br>Unattempted: ${u}<br><b>Score: ${c} / ${activeQuestions.length}</b>`;show("result")};
$("reviewBtn").onclick=()=>{let r=$("review");r.innerHTML="";activeQuestions.forEach((q,i)=>{let a=answers[q.id],status=(a===undefined||a===4)?"Unattempted":a===q.answer?"Correct":"Wrong",d=document.createElement("div");d.className="card review-card";d.innerHTML=`<div class="review-q">${i+1}. ${q.q}</div><p>Status: <b>${status}</b></p>`+q.options.map((o,k)=>`<div class="review-option ${k===q.answer?"correct":(k===a&&a!==4?"wrong":"")}"><b>(${String.fromCharCode(65+k)})</b> ${o}</div>`).join("")+`<div class="review-option"><b>(E)</b> Question not attempted</div><p><b>Explanation:</b> ${q.explanation}</p>`;r.appendChild(d)})};
$("homeBtn").onclick=()=>{initHome();show("home")};function goHome(){initHome();show("home")}initHome();
</script></body></html>
