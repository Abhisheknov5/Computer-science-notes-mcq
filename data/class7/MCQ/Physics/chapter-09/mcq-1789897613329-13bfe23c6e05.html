<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>चुंबकों द्वारा मनोरंजन | MCQ Practice</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#172b4d;line-height:1.6}
.container{max-width:1100px;margin:auto;padding:24px 20px}
.card{background:#fff;border-radius:18px;box-shadow:0 5px 18px rgba(0,0,0,.08)}
.hidden{display:none!important}
h1,h2,h3{margin-top:0}
button,select{font:inherit}
button{border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.home{padding:28px}
.home h1{font-size:32px;margin-bottom:6px}
.sub{color:#536579;font-size:18px}
.section{border:1px solid #d4dae2;border-radius:12px;padding:17px 20px;margin:12px 0;cursor:pointer;background:#fafbfc}
.section:hover{background:#f5f8fc}
.section-title{font-size:20px;font-weight:700;color:#111}
.section-count{color:#536579}
.setup{padding:28px}
.question-select-row{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.question-select-row label{font-size:18px;white-space:nowrap}
.back{display:inline-block;color:#2563eb;text-decoration:none;font-weight:700;margin-bottom:18px}
select{padding:10px 14px;border:1px solid #ccc;border-radius:8px;margin-left:8px}
.next{background:#16a34a;color:#fff}
.prev{background:#6b7280;color:#fff}
.submit{background:#2563eb;color:#fff}
.quiz-topbar{margin:0 0 14px}
.topics-back{padding:12px 18px;border:1px solid #d1d5db;border-radius:10px;background:#f5f5f5;color:#111827;font-size:16px;cursor:pointer}
.topics-back:hover{background:#e5e7eb}
.quiz-header{padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.quiz-header strong{font-size:18px}
.question-card{padding:26px;margin-bottom:18px}
.question{font-size:22px;font-weight:700;margin-bottom:20px;white-space:pre-line}
.option{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px;border:2px solid #e1e5ea;background:#fff;border-radius:10px}
.option:hover{border-color:#2563eb;background:#eff6ff}
.option.selected{border-color:#2563eb;background:#dbeafe}
.option.correct{border-color:#16a34a;background:#dcfce7}
.option.wrong{border-color:#dc2626;background:#fee2e2}
.feedback{min-height:28px;font-weight:700;margin-top:12px}
.explanation{margin-top:14px;padding:16px 18px;border-left:5px solid #2563eb;border-radius:10px;background:#eff6ff;color:#172b4d;font-size:16px;line-height:1.65}
.explanation-title{font-weight:700;font-size:18px;margin-bottom:6px}
.bottom{padding:18px 24px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}
.palette{padding:20px 24px}
.pal-grid{display:flex;flex-wrap:wrap;gap:8px}
.pal{background:#fff;border:1px solid #d4dae2;width:58px;min-width:58px;height:52px;padding:8px 4px}
.pal.active{outline:3px solid #2563eb}
.pal.done{background:#dbeafe}
.result{padding:32px;text-align:center}
.stat{font-size:18px;line-height:2}
.review-card{margin-top:16px;padding:22px;text-align:left}
.review-q{font-size:20px;font-weight:700}
.review-option{padding:10px 12px;margin:7px 0;border-radius:8px;border:1px solid #ddd}
.review-option.correct{background:#dcfce7;border-color:#16a34a}
.review-option.wrong{background:#fee2e2;border-color:#dc2626}
@media(max-width:650px){
.container{padding:14px}
.home h1{font-size:26px}
.question{font-size:19px}
.quiz-header,.bottom{flex-direction:column;align-items:stretch}
.bottom button{margin:4px 0}
.pal{width:50px;min-width:50px;height:48px}
}
</style>
</head>
<body>
<div class="container">
<div id="home" class="card home">
<h1>📚 चुंबकों द्वारा मनोरंजन MCQ Practice</h1>
<div class="sub">Class 6 Physics • 150 MCQs • 5 Sections</div>
<div id="sectionsList"></div>
</div>

<div id="setup" class="card setup hidden">
<a href="#" class="back" onclick="goHome();return false;">← Back to Sections</a>
<h2 id="setupTitle"></h2>
<p class="sub" id="setupInfo"></p>
<div class="question-select-row">
<label><b>Questions:</b></label>
<select id="questionCount"></select>
</div>
<br><br>
<button class="next" onclick="startPractice()">🚀 Start Practice</button>
</div>

<div id="quiz" class="hidden">
<div class="quiz-topbar">
<button class="topics-back" onclick="goHome()">← Topics</button>
</div>
<div class="card quiz-header">
<strong id="sectionName"></strong>
<div id="counter"></div>
<div id="attempted"></div>
</div>

<div class="card question-card">
<div class="question" id="question"></div>
<div id="options"></div>
<div class="feedback" id="feedback"></div>
<div class="explanation hidden" id="explanation"></div>
</div>

<div class="card bottom">
<div>
<button class="prev" id="prevBtn">← Previous</button>
<button class="submit" id="checkBtn">Check Answer</button>
<button class="next" id="nextBtn">Next →</button>
</div>
<button class="submit" id="submitBtn">Submit Test</button>
</div>

<div class="card palette">
<h3>Question Palette</h3>
<div class="pal-grid" id="palette"></div>
</div>
</div>

<div id="result" class="card result hidden">
<h2>🎯 Test Result</h2>
<div class="stat" id="resultText"></div>
<br>
<button class="next" id="reviewBtn">👁️ Review Answers</button>
<button class="prev" id="homeBtn">Choose Section</button>
</div>
</div>

<script>
const questions=[{"id":1,"q":"Q1. प्राकृतिक चुंबक का उदाहरण क्या है?","options":["मैग्नेटाइट","प्लास्टिक","लकड़ी","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** मैग्नेटाइट एक प्राकृतिक रूप से पाया जाने वाला चुंबक है। अध्याय में बताया गया है कि प्राकृतिक रूप से मिलने वाले पदार्थों में चुंबकीय गुण पाए जा सकते हैं।"},{"id":2,"q":"Q2. चुंबक किन पदार्थों को आकर्षित करता है?","options":["लोहा","निकिल","कोबाल्ट","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** अध्याय के अनुसार चुंबक लोहा, निकिल और कोबाल्ट जैसे कुछ पदार्थों को आकर्षित करता है। इन्हें चुंबकीय पदार्थ कहा जाता है।"},{"id":3,"q":"Q3. जो पदार्थ चुंबक द्वारा आकर्षित होते हैं, उन्हें क्या कहते हैं?","options":["चुंबकीय पदार्थ","अचुंबकीय पदार्थ","पारदर्शी पदार्थ","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय में चुंबक द्वारा आकर्षित होने वाले पदार्थों को **चुंबकीय पदार्थ** कहा गया है।"},{"id":4,"q":"Q4. जो पदार्थ चुंबक से आकर्षित नहीं होते, वे कहलाते हैं—","options":["चुंबकीय पदार्थ","अचुंबकीय पदार्थ","प्राकृतिक चुंबक","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"** चुंबक से आकर्षित न होने वाले पदार्थों को अचुंबकीय पदार्थ कहा जाता है। अध्याय में चुंबकीय और अचुंबकीय पदार्थों का यही वर्गीकरण दिया गया है।"},{"id":5,"q":"Q5. कृत्रिम चुंबक किससे बनाए जा सकते हैं?","options":["लोहे के टुकड़ों से","केवल लकड़ी से","केवल काँच से","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय में लोहे के टुकड़ों से चुंबक बनाने की विधि बताई गई है। ऐसे चुंबकों को कृत्रिम चुंबक कहा जाता है।"},{"id":6,"q":"Q6. निम्न में से कौन कृत्रिम चुंबक का आकार है?","options":["छड़ चुंबक","नाल चुंबक","बेलनाकार चुंबक","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** अध्याय में कृत्रिम चुंबकों के विभिन्न आकार बताए गए हैं, जैसे छड़ चुंबक, नाल चुंबक तथा बेलनाकार/गोलाकार चुंबक।"},{"id":7,"q":"Q7. मैग्नेटाइट में मुख्य रूप से कौन-सा पदार्थ होता है?","options":["लोहा","लकड़ी","प्लास्टिक","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय में बताया गया है कि मैग्नेटाइट में लोहा होता है और इसे प्राकृतिक चुंबक के रूप में जाना जाता है।"},{"id":8,"q":"Q8. प्राचीन यूनान की कहानी में चरवाहे का नाम क्या बताया गया है?","options":["मैग्नस","ह्वांग टी","कम्पास","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय में प्राचीन यूनान के एक चरवाहे मैग्नस की कहानी दी गई है, जिसकी लोहे की टोपी वाली छड़ी चट्टान की ओर आकर्षित हुई।"},{"id":9,"q":"Q9. प्राकृतिक चुंबक की खोज से संबंधित कहानी किससे जुड़ी है?","options":["मैग्नस","ह्वांग टी","किसी वैज्ञानिक प्रयोगशाला से","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** पाठ में प्राकृतिक चुंबक की खोज की कहानी चरवाहे मैग्नस से जोड़ी गई है।"},{"id":10,"q":"Q10. चुंबक के कितने ध्रुव होते हैं?","options":["एक","दो","तीन","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"** प्रत्येक चुंबक के दो ध्रुव होते हैं—उत्तरी ध्रुव और दक्षिणी ध्रुव। चुंबक के आकार से ध्रुवों की संख्या नहीं बदलती।"},{"id":11,"q":"Q11. चुंबक के दो ध्रुव कौन-से हैं?","options":["पूर्वी और पश्चिमी","उत्तरी और दक्षिणी","ऊपरी और निचले","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"** अध्याय के अनुसार प्रत्येक चुंबक में उत्तरी ध्रुव तथा दक्षिणी ध्रुव होते हैं। इन्हें सामान्यतः N और S से दर्शाया जाता है।"},{"id":12,"q":"Q12. स्वतंत्र रूप से लटकाया गया चुंबक किस दिशा में रुकता है?","options":["पूर्व-पश्चिम","उत्तर-दक्षिण","केवल पूर्व","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"** स्वतंत्र रूप से लटकाया गया चुंबक हमेशा उत्तर-दक्षिण दिशा में आकर रुकता है। यह चुंबक का महत्वपूर्ण गुण है।"},{"id":13,"q":"Q13. चुंबक का वह सिरा जो उत्तर दिशा की ओर संकेत करता है, कहलाता है—","options":["दक्षिणी ध्रुव","उत्तरी ध्रुव","मध्य ध्रुव","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"** उत्तर दिशा की ओर संकेत करने वाले चुंबक के सिरे को उत्तरी ध्रुव कहा जाता है।"},{"id":14,"q":"Q14. चुंबक का दक्षिण दिशा की ओर संकेत करने वाला सिरा कहलाता है—","options":["उत्तरी ध्रुव","दक्षिणी ध्रुव","पूर्वी ध्रुव","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"** चुंबक का वह सिरा जो दक्षिण दिशा की ओर संकेत करता है, दक्षिणी ध्रुव कहलाता है।"},{"id":15,"q":"Q15. चुंबक के ध्रुव सामान्यतः किस अक्षर से दर्शाए जाते हैं?","options":["N और S","E और W","A और B","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** पाठ में उत्तरी ध्रुव के लिए N और दक्षिणी ध्रुव के लिए S चिह्न का उपयोग बताया गया है।"},{"id":16,"q":"Q16. कंपास को हिंदी में किस नाम से भी जाना जाता है?","options":["दिशासूचक","तापमापी","दाबमापी","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय में कंपास को **कंपास (दिक्सूचक)** कहा गया है। इसका उपयोग दिशा निर्धारण में किया जाता है।"},{"id":17,"q":"Q17. कंपास की सुई किस प्रकार की होती है?","options":["चुंबकीय","लकड़ी की","काँच की","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** कंपास में एक चुंबकीय सुई धुरी पर स्वतंत्र रूप से घूमती है। स्थिर होने पर यह उत्तर-दक्षिण दिशा बताती है।"},{"id":18,"q":"Q18. कंपास में चुंबकीय सुई कहाँ लगी होती है?","options":["एक धुरी पर","कागज पर स्थिर","लकड़ी के टुकड़े पर बिना धुरी के","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय में बताया गया है कि चुंबकीय सुई एक धुरी पर लगी होती है और स्वतंत्र रूप से घूम सकती है।"},{"id":19,"q":"Q19. कंपास का मुख्य उपयोग क्या है?","options":["दिशा ज्ञात करना","तापमान ज्ञात करना","द्रव्यमान ज्ञात करना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** कंपास की चुंबकीय सुई उत्तर-दक्षिण दिशा बताती है, इसलिए इसका उपयोग दिशा निर्धारण के लिए किया जाता है।"},{"id":20,"q":"Q20. कृत्रिम चुंबक किस पदार्थ से बनाया जा सकता है?","options":["लोहा","कागज","लकड़ी","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय में लोहे की छड़ को चुंबकित करके कृत्रिम चुंबक बनाने की विधि दी गई है।"},{"id":21,"q":"Q21. लोहे की छड़ को चुंबक बनाने के लिए क्या किया जाता है?","options":["चुंबक के एक ही ध्रुव से बार-बार रगड़ा जाता है","पानी में डुबोया जाता है","गर्म किया जाता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय की विधि में चुंबक के एक ध्रुव को लोहे की छड़ के एक सिरे से दूसरे सिरे तक एक ही दिशा में बार-बार ले जाया जाता है। प्रक्रिया लगभग 30–40 बार दोहराई जाती है।"},{"id":22,"q":"Q22. लोहे की छड़ को चुंबक बनाने की प्रक्रिया कितनी बार दोहराने का सुझाव दिया गया है?","options":["2–3 बार","लगभग 30–40 बार","100 बार","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"** पाठ में लोहे की छड़ को चुंबकित करने की प्रक्रिया लगभग 30–40 बार दोहराने को कहा गया है।"},{"id":23,"q":"Q23. चुंबक के किस गुण से दिशा ज्ञात की जाती है?","options":["स्वतंत्र रूप से लटकाने पर उत्तर-दक्षिण दिशा में रुकना","रंग बदलना","गर्म होना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** स्वतंत्र रूप से लटका चुंबक उत्तर-दक्षिण दिशा में स्थिर होता है। इसी गुण का उपयोग दिशा निर्धारण में किया जाता है।"},{"id":24,"q":"Q24. चुंबक के समान ध्रुवों के बीच क्या होता है?","options":["आकर्षण","प्रतिकर्षण","कोई प्रभाव नहीं","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"** दो चुंबकों के समान ध्रुव एक-दूसरे को प्रतिकर्षित करते हैं। जैसे N–N या S–S।"},{"id":25,"q":"Q25. चुंबक के असमान ध्रुवों के बीच क्या होता है?","options":["आकर्षण","प्रतिकर्षण","कोई प्रभाव नहीं","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** विपरीत या असमान ध्रुव एक-दूसरे को आकर्षित करते हैं। उदाहरण के लिए N–S के बीच आकर्षण होता है।"},{"id":26,"q":"Q26. N–N ध्रुवों के बीच क्या होगा?","options":["आकर्षण","प्रतिकर्षण","कोई प्रभाव नहीं","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"** दोनों ध्रुव समान हैं। समान ध्रुवों में प्रतिकर्षण होता है।"},{"id":27,"q":"Q27. N–S ध्रुवों के बीच क्या होगा?","options":["आकर्षण","प्रतिकर्षण","कोई प्रभाव नहीं","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** N और S असमान ध्रुव हैं। अध्याय के अनुसार असमान ध्रुव एक-दूसरे को आकर्षित करते हैं।"},{"id":28,"q":"Q28. S–S ध्रुवों के बीच क्या होगा?","options":["आकर्षण","प्रतिकर्षण","कोई प्रभाव नहीं","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"** S और S समान ध्रुव हैं। समान ध्रुवों के बीच प्रतिकर्षण होता है।"},{"id":29,"q":"Q29. चुंबक को गर्म करने पर क्या हो सकता है?","options":["वह अपने चुंबकीय गुण खो सकता है","वह अधिक शक्तिशाली हो जाता है","उसके ध्रुव तीन हो जाते हैं","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय में चेतावनी दी गई है कि चुंबक को गर्म करने पर वह अपने गुण खो सकता है।"},{"id":30,"q":"Q30. चुंबक को हथौड़े से पीटने पर क्या हो सकता है?","options":["उसके चुंबकीय गुण समाप्त हो सकते हैं","उसकी शक्ति निश्चित रूप से बढ़ती है","वह दो ध्रुवों से चार ध्रुवों वाला हो जाता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** पाठ में बताया गया है कि चुंबक को हथौड़े से पीटने पर वह अपने चुंबकीय गुण खो सकता है।"},{"id":31,"q":"Q31. चुंबक को ऊँचाई से गिराने पर क्या हो सकता है?","options":["चुंबकीय गुण खो सकता है","हमेशा अधिक शक्तिशाली हो जाता है","उसमें नया ध्रुव बनता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय की चेतावनी के अनुसार ऊँचाई से गिराने पर भी चुंबक अपने चुंबकीय गुण खो सकता है।"},{"id":32,"q":"Q32. चुंबक को किन उपकरणों से दूर रखने की सलाह दी गई है?","options":["टेलीविजन","कंप्यूटर","मोबाइल/म्यूजिक सिस्टम","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** अध्याय में चुंबकों को टीवी, मोबाइल, टेलीविजन, म्यूजिक सिस्टम, CD और कंप्यूटर आदि से दूर रखने की सलाह दी गई है।"},{"id":33,"q":"Q33. नाल-चुंबक को सुरक्षित रखने के लिए उसके ध्रुवों के संपर्क में क्या रखना चाहिए?","options":["लोहे का टुकड़ा","कागज का टुकड़ा","लकड़ी का टुकड़ा ही","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय के अनुसार नाल-चुंबक के ध्रुवों के संपर्क में लोहे का टुकड़ा रखना चाहिए।"},{"id":34,"q":"Q34. छड़ चुंबक के ध्रुव सामान्यतः कहाँ होते हैं?","options":["दोनों सिरों के पास","केवल बीच में","केवल एक सिरे पर","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय में लोहे के बुरादे के प्रयोग से दिखाया गया है कि अधिकतर बुरादा छड़ चुंबक के दोनों सिरों के पास चिपकता है, जहाँ ध्रुव स्थित होते हैं।"},{"id":35,"q":"Q35. लोहे का बुरादा छड़ चुंबक के किन भागों पर अधिक चिपकता है?","options":["दोनों सिरों के पास","केवल मध्य भाग में","किसी भी स्थान पर समान मात्रा में","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय के प्रयोग में देखा गया कि लोहे का बुरादा छड़ चुंबक के दोनों सिरों के पास अधिक मात्रा में चिपकता है। इससे ध्रुवों की स्थिति का पता लगाया जा सकता है। \n\n# Section B – Concept Based MCQs (Q36–Q70)"},{"id":36,"q":"Q36. किसी वस्तु को चुंबकीय पदार्थ कहने का सबसे उचित आधार क्या है?","options":["उसका चुंबक द्वारा आकर्षित होना","उसका चमकीला होना","उसका भारी होना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** पदार्थ का चुंबकीय या अचुंबकीय होना उसके चुंबक के प्रति व्यवहार से निर्धारित किया जाता है। आकर्षित होने वाला पदार्थ चुंबकीय कहलाता है।"},{"id":37,"q":"Q37. लोहे की कील को चुंबक के पास लाने पर वह आकर्षित होती है। इससे क्या निष्कर्ष निकलता है?","options":["कील चुंबकीय पदार्थ है","कील अचुंबकीय पदार्थ है","कील पारदर्शी है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** किसी पदार्थ का चुंबक की ओर आकर्षित होना उसके चुंबकीय पदार्थ होने का संकेत है। लोहा अध्याय में चुंबकीय पदार्थ के उदाहरण के रूप में दिया गया है।"},{"id":38,"q":"Q38. यदि कोई वस्तु चुंबक से आकर्षित नहीं होती, तो उसे क्या कहा जाएगा?","options":["चुंबकीय","अचुंबकीय","प्राकृतिक चुंबक","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"** चुंबक द्वारा आकर्षित न होने वाले पदार्थों को अचुंबकीय पदार्थ कहा जाता है।"},{"id":39,"q":"Q39. किसी छड़ चुंबक के मध्य भाग की तुलना में सिरों पर अधिक लोहे का बुरादा चिपकता है। इसका कारण क्या है?","options":["ध्रुव सिरों के पास होते हैं","मध्य भाग गर्म होता है","सिरों का रंग अलग होता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** प्रयोग से पता चलता है कि छड़ चुंबक के दोनों सिरों के पास चुंबकीय प्रभाव अधिक होता है। ये स्थान उसके ध्रुवों के पास होते हैं।"},{"id":40,"q":"Q40. किसी चुंबक को स्वतंत्र रूप से लटकाने पर उसके रुकने की दिशा का उपयोग किसके लिए किया जा सकता है?","options":["दिशा निर्धारण","तापमान मापने","वजन मापने","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** स्वतंत्र रूप से लटका चुंबक उत्तर-दक्षिण दिशा में स्थिर होता है। इसी गुण से दिशा ज्ञात की जाती है।"},{"id":41,"q":"Q41. यदि चुंबक को घुमाकर छोड़ दिया जाए, तो वह अंततः क्या करेगा?","options":["उत्तर-दक्षिण दिशा में रुक जाएगा","हमेशा घूमता रहेगा","पूर्व-पश्चिम दिशा में स्थिर होगा","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय के प्रयोग में स्वतंत्र रूप से लटकाए गए चुंबक को अलग-अलग दिशाओं में घुमाकर छोड़ने पर वह उत्तर-दक्षिण दिशा में आकर रुकता है।"},{"id":42,"q":"Q42. चुंबक की दिशा बताने वाले गुण का उपयोग किस यंत्र में किया गया है?","options":["कंपास","थर्मामीटर","घड़ी","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** कंपास में चुंबकीय सुई का उत्तर-दक्षिण दिशा में स्थिर होने का गुण दिशा निर्धारण के लिए उपयोग किया जाता है।"},{"id":43,"q":"Q43. दो चुंबकों के N और N ध्रुवों को पास लाने पर क्या अनुभव होगा?","options":["वे एक-दूसरे को दूर धकेलेंगे","वे एक-दूसरे को खींचेंगे","कोई प्रभाव नहीं होगा","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** N और N समान ध्रुव हैं। समान ध्रुवों के बीच प्रतिकर्षण होता है।"},{"id":44,"q":"Q44. N और S ध्रुवों को पास लाने पर क्या होगा?","options":["आकर्षण","प्रतिकर्षण","कोई प्रभाव नहीं","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** N और S असमान ध्रुव हैं। असमान ध्रुवों में आकर्षण होता है।"},{"id":45,"q":"Q45. यदि किसी छड़ के दोनों सिरों पर N ध्रुव चिह्नित किए गए हैं, तो क्या निष्कर्ष उचित है?","options":["वह एक सामान्य चुंबक के रूप में सही नहीं हो सकता","चुंबक में हमेशा दो विपरीत ध्रुव होते हैं","दोनों सिरों पर समान ध्रुव होना सामान्य नियम है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय के अनुसार प्रत्येक चुंबक में एक उत्तरी और एक दक्षिणी ध्रुव होता है। इसलिए सामान्य छड़ चुंबक के दोनों सिरों को N नहीं माना जा सकता।"},{"id":46,"q":"Q46. यदि किसी चुंबक का एक ध्रुव पहचान लिया जाए, तो दूसरे ध्रुव की पहचान कैसे होगी?","options":["वह विपरीत ध्रुव होगा","वह हमेशा वही ध्रुव होगा","चुंबक में दूसरा ध्रुव नहीं होता","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** प्रत्येक चुंबक में दो ध्रुव होते हैं—एक उत्तरी और दूसरा दक्षिणी। अतः एक ध्रुव N है तो दूसरा S होगा।"},{"id":47,"q":"Q47. लोहे की छड़ को चुंबक बनाने की प्रक्रिया में दिशा क्यों नहीं बदलनी चाहिए?","options":["अध्याय की विधि में एक ही ध्रुव से एक ही दिशा में रगड़ना बताया गया है","दिशा बदलने से चुंबक निश्चित रूप से दोगुना शक्तिशाली होगा","दिशा बदलना प्रक्रिया का आवश्यक भाग है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** चुंबक बनाने की दी गई विधि में चुंबक के ध्रुव और रगड़ने की दिशा को नहीं बदलना चाहिए।"},{"id":48,"q":"Q48. यदि चुंबक से लोहे की छड़ को बार-बार रगड़ा जाए, तो छड़ में क्या उत्पन्न किया जा सकता है?","options":["चुंबकीय गुण","पारदर्शिता","विद्युत धारा","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय में लोहे की छड़ को चुंबकित करने की विधि बताई गई है, जिससे लोहे की छड़ चुंबक बन सकती है।"},{"id":49,"q":"Q49. कंपास की सुई को पास के चुंबक से प्रभावित होने का मुख्य कारण क्या है?","options":["सुई स्वयं चुंबकीय होती है","सुई लकड़ी की बनी होती है","सुई का रंग बदलता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** कंपास की सुई चुंबकीय होती है और स्वतंत्र रूप से घूमती है। इसलिए पास में चुंबक लाने पर उसकी दिशा प्रभावित हो सकती है।"},{"id":50,"q":"Q50. दिशा निर्धारण में सूर्य की सहायता क्यों सीमित मानी गई है?","options":["सूर्य से दिशा का अनुमान लगाया जा सकता है, लेकिन यह विधि एकदम ठीक नहीं हो सकती","सूर्य दिशा बदल देता है","सूर्य चुंबक है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय में बताया गया है कि उगते सूर्य की दिशा से पूर्व का अनुमान लगाया जा सकता है, लेकिन दिशा निर्धारण के लिए यह विधि बिल्कुल सटीक नहीं हो सकती।"},{"id":51,"q":"Q51. यदि आपका चेहरा पूर्व दिशा की ओर है, तो उत्तर दिशा आपके किस ओर होगी?","options":["बाईं ओर","दाईं ओर","सामने","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय में इसी प्रकार बताया गया है कि यदि चेहरा पूर्व की ओर हो तो उत्तर दिशा बाईं ओर होगी।"},{"id":52,"q":"Q52. कंपास की सुई को उत्तर-दक्षिण दिशा में स्थिर होने तक क्या किया जाता है?","options":["कंपास को घुमाया जा सकता है","कंपास को गर्म किया जाता है","सुई को हाथ से पकड़कर मोड़ा जाता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय के अनुसार कंपास को तब तक घुमाया जाता है जब तक डायल पर उत्तर-दक्षिण के चिह्न सुई के सिरों पर न आ जाएँ।"},{"id":53,"q":"Q53. चुंबक की ध्रुवीयता पता करने के लिए लोहे के बुरादे का उपयोग क्यों किया जाता है?","options":["इससे चुंबकीय प्रभाव वाले भागों का पता चलता है","इससे चुंबक का रंग पता चलता है","इससे चुंबक का तापमान पता चलता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** लोहे का बुरादा चुंबक के अधिक प्रभाव वाले भागों, विशेषकर ध्रुवों के पास अधिक चिपकता है। इससे ध्रुवों की स्थिति समझी जा सकती है।"},{"id":54,"q":"Q54. रेत में रगड़े गए चुंबक पर लोहे के कण चिपक जाएँ तो क्या संकेत मिलता है?","options":["रेत में लोहे के कण उपस्थित हो सकते हैं","रेत पूरी तरह चुंबकीय है","चुंबक अचुंबकीय है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय की गतिविधि में चुंबक को रेत/मिट्टी में रगड़कर उससे चिपके कणों से यह पता लगाया जाता है कि वहाँ लौह कण मौजूद हैं या नहीं।"},{"id":55,"q":"Q55. चुंबक के रंग को बदलने से उसके आकर्षण पर क्या निष्कर्ष निकाला जा सकता है?","options":["केवल रंग देखकर चुंबकीय गुण तय नहीं किए जा सकते","रंग बदलते ही चुंबक निश्चित रूप से अचुंबकीय हो जाता है","रंग ही चुंबकीय गुण का आधार है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय का मुख्य आधार पदार्थ के चुंबक के प्रति आकर्षण/व्यवहार पर है, न कि उसके रंग पर। चुंबकीय गुण पदार्थ की प्रकृति से संबंधित हैं।"},{"id":56,"q":"Q56. किसी वस्तु के पदार्थ की पहचान करने में चुंबक किस प्रकार सहायक हो सकता है?","options":["वस्तु चुंबक से आकर्षित होती है या नहीं, यह जाँचकर","वस्तु का आकार देखकर","केवल उसका रंग देखकर","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** चुंबक की सहायता से वस्तु में चुंबकीय पदार्थ की उपस्थिति की जाँच की जा सकती है। अध्याय में विभिन्न वस्तुओं को चुंबक से जाँचने की गतिविधि दी गई है।"},{"id":57,"q":"Q57. यदि दो चुंबकीय ध्रुव एक-दूसरे को दूर धकेलते हैं, तो वे ध्रुव कैसे होंगे?","options":["समान","असमान","एक चुंबकीय और एक अचुंबकीय","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** समान ध्रुवों में प्रतिकर्षण होता है। N–N तथा S–S इसके उदाहरण हैं।"},{"id":58,"q":"Q58. यदि दो चुंबकीय ध्रुव एक-दूसरे को खींचते हैं, तो वे कैसे होंगे?","options":["असमान","समान","दोनों अचुंबकीय","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** असमान ध्रुव, अर्थात N और S, एक-दूसरे को आकर्षित करते हैं।"},{"id":59,"q":"Q59. चुंबक की पहचान करने के लिए केवल लोहे को आकर्षित करना पर्याप्त क्यों नहीं है?","options":["चुंबक के अन्य गुण भी होते हैं, जैसे ध्रुव और दिशा निर्धारण","लोहे को आकर्षित करना चुंबक का कोई गुण नहीं है","चुंबक केवल लकड़ी को आकर्षित करता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय में चुंबक के कई गुण बताए गए हैं—कुछ पदार्थों को आकर्षित करना, दो ध्रुव होना, स्वतंत्र रूप से लटकने पर उत्तर-दक्षिण दिशा में रुकना और ध्रुवों का आकर्षण-प्रतिकर्षण।"},{"id":60,"q":"Q60. यदि छड़ चुंबक के ध्रुवों पर कोई चिह्न नहीं है, तो कौन-सा तरीका उपयोगी हो सकता है?","options":["उसे स्वतंत्र रूप से लटकाकर दिशा देखना","उसे पानी में उबालना","उसे हथौड़े से पीटना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** स्वतंत्र रूप से लटकाने पर एक सिरा उत्तर की ओर और दूसरा दक्षिण की ओर संकेत करता है। इससे ध्रुवों की पहचान की जा सकती है।"},{"id":61,"q":"Q61. चुंबक को बार-बार गर्म करने की सलाह क्यों नहीं दी जाती?","options":["वह चुंबकीय गुण खो सकता है","वह हमेशा अधिक शक्तिशाली हो जाता है","उसमें कोई परिवर्तन नहीं होता","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** पाठ में स्पष्ट चेतावनी है कि गर्म करने पर चुंबक अपने गुण खो सकता है।"},{"id":62,"q":"Q62. चुंबक को सुरक्षित रखने के लिए उचित उपाय कौन-सा है?","options":["उसे सावधानी से रखना","उसे बार-बार गिराना","उसे हथौड़े से पीटना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अनुचित रखरखाव से चुंबक समय के साथ कमजोर हो सकता है। अध्याय में चुंबकों के सुरक्षित भंडारण के उपाय बताए गए हैं।"},{"id":63,"q":"Q63. चुंबक के ध्रुवों को सुरक्षित रखने के लिए क्या किया जाता है?","options":["नाल चुंबक के ध्रुवों के संपर्क में लोहे का टुकड़ा रखा जाता है","उसे आग में रखा जाता है","उसे हथौड़े से पीटा जाता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय में नाल चुंबक के सुरक्षित भंडारण के लिए उसके ध्रुवों के संपर्क में लोहे का टुकड़ा रखने की बात कही गई है।"},{"id":64,"q":"Q64. यदि कोई छड़ चुंबक दिशा बदलने के बाद हर बार एक ही दिशा में नहीं रुकता, तो क्या जाँचना चाहिए?","options":["क्या वह वास्तव में चुंबकित है","उसका रंग","उसका वजन ही","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** चुंबक की पहचान का एक महत्वपूर्ण गुण यह है कि स्वतंत्र रूप से लटकाने पर वह उत्तर-दक्षिण दिशा में रुकता है।"},{"id":65,"q":"Q65. लोहे की छड़ को चुंबकित करते समय चुंबक के ध्रुव को बदलना चाहिए?","options":["नहीं","हाँ, हर बार बदलना चाहिए","केवल आधी प्रक्रिया में बदलना चाहिए","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** पाठ में स्पष्ट रूप से चुंबक के ध्रुव और लोहे की छड़ पर रगड़ने की दिशा को नहीं बदलने को कहा गया है।"},{"id":66,"q":"Q66. चुंबक की सहायता से लकड़ी की वस्तु और लोहे की वस्तु में अंतर कैसे किया जा सकता है?","options":["चुंबक के पास लाकर","दोनों को गर्म करके","दोनों को पानी में डालकर","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** लोहे जैसी चुंबकीय वस्तु चुंबक से आकर्षित होगी, जबकि लकड़ी जैसी अचुंबकीय वस्तु आकर्षित नहीं होगी।"},{"id":67,"q":"Q67. चुंबक के दोनों सिरों के पास अधिक बुरादा चिपकना क्या बताता है?","options":["दोनों सिरों के पास चुंबकीय प्रभाव अधिक है","केवल मध्य भाग चुंबकीय है","चुंबक अचुंबकीय है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** लोहे के बुरादे की व्यवस्था से पता चलता है कि चुंबकीय प्रभाव सिरों के पास अधिक है, जहाँ ध्रुव स्थित होते हैं।"},{"id":68,"q":"Q68. दिशा निर्धारण में चुंबक का कौन-सा गुण सबसे उपयोगी है?","options":["उसका स्वतंत्र रूप से उत्तर-दक्षिण दिशा में रुकना","उसका रंग","उसका आकार","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** चुंबक का यही गुण प्राचीन समय से दिशा निर्धारण में उपयोग किया जाता रहा है और इसी पर कंपास आधारित है।"},{"id":69,"q":"Q69. किसी चुंबक को स्वतंत्र रूप से लटकाने पर कौन-सा सिरा उत्तर की ओर संकेत करेगा?","options":["उत्तरी ध्रुव","दक्षिणी ध्रुव","दोनों ध्रुव","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** चुंबक का उत्तरी ध्रुव उत्तर दिशा की ओर संकेत करता है। दूसरा सिरा दक्षिण दिशा की ओर संकेत करता है।"},{"id":70,"q":"Q70. चुंबक के ध्रुवों का सही संबंध कौन-सा है?","options":["N–N → प्रतिकर्षण","S–S → प्रतिकर्षण","N–S → आकर्षण","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** समान ध्रुव N–N और S–S प्रतिकर्षित होते हैं, जबकि असमान ध्रुव N–S आकर्षित होते हैं। \n\n# Section C – Statement Based MCQs (Q71–Q105)\n\n**प्रत्येक प्रश्न में:**\nA. केवल 1 और 2 सही हैं।\nB. केवल 1 और 3 सही हैं।\nC. केवल 2 और 3 सही हैं।\nD. उपर्युक्त में से एक से अधिक सही हैं।\nE. इनमें से कोई नहीं।"},{"id":71,"q":"Q71.\n\n1. मैग्नेटाइट प्राकृतिक चुंबक है।\n2. कुछ चट्टानों में लोहे को आकर्षित करने का गुण पाया जाता है।\n3. सभी चट्टानें चुंबकीय होती हैं।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** मैग्नेटाइट प्राकृतिक चुंबक है और कुछ चट्टानों में चुंबकीय गुण पाए जाते हैं। लेकिन सभी चट्टानें चुंबकीय नहीं होतीं।"},{"id":72,"q":"Q72.\n\n1. लोहे को चुंबक आकर्षित करता है।\n2. निकिल चुंबकीय पदार्थ हो सकता है।\n3. कोबाल्ट भी चुंबकीय पदार्थों में शामिल है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** तीनों कथन अध्याय के अनुसार सही हैं। लोहा, निकिल और कोबाल्ट चुंबक द्वारा आकर्षित होने वाले पदार्थों के उदाहरण हैं।"},{"id":73,"q":"Q73.\n\n1. चुंबक से आकर्षित पदार्थ चुंबकीय पदार्थ कहलाते हैं।\n2. चुंबक से आकर्षित न होने वाले पदार्थ अचुंबकीय कहलाते हैं।\n3. प्रत्येक पदार्थ चुंबकीय होता है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** पहले दोनों कथन पाठ में दिए वर्गीकरण को बता या नहीं करता है।","कथन (A) सही है, लेकिन कारण (R) गलत है।","कथन (A) गलत है, लेकिन कारण (R) सही है।","कथन (A) और कारण (R) दोनों गलत हैं।"],"answer":0,"explanation":"** धुरी पर लगी होने के कारण चुंबकीय सुई स्वतंत्र रूप से घूम सकती है और स्थिर होकर दिशा बताती है।"},{"id":123,"q":"Q123.\n\n**कथन (A):** सभी कृत्रिम चुंबक केवल छड़ के आकार के होते हैं।\n**कारण (R):** कृत्रिम चुंबक विभिन्न आकृतियों में बनाए जाते हैं।","options":["कथन (A) और कारण (R) दोनों सही हैं तथा कारण (R), कथन (A) की सही व्याख्या करता है।","कथन (A) और कारण (R) दोनों सही हैं, लेकिन कारण (R), कथन (A) की सही व्याख्या नहीं करता है।","कथन (A) सही है, लेकिन कारण (R) गलत है।","कथन (A) गलत है, लेकिन कारण (R) सही है।","कथन (A) और कारण (R) दोनों गलत हैं।"],"answer":3,"explanation":"** कारण सही है, लेकिन कथन गलत है। अध्याय में छड़, नाल, बेलनाकार और गोलाकार जैसे विभिन्न आकारों का उल्लेख है।"},{"id":124,"q":"Q124.\n\n**कथन (A):** चुंबक को ऊँचाई से गिराने से बचना चाहिए।\n**कारण (R):** ऊँचाई से गिराने पर चुंबक अपने चुंबकीय गुण खो सकता है।","options":["कथन (A) और कारण (R) दोनों सही हैं तथा कारण (R), कथन (A) की सही व्याख्या करता है।","कथन (A) और कारण (R) दोनों सही हैं, लेकिन कारण (R), कथन (A) की सही व्याख्या नहीं करता है।","कथन (A) सही है, लेकिन कारण (R) गलत है।","कथन (A) गलत है, लेकिन कारण (R) सही है।","कथन (A) और कारण (R) दोनों गलत हैं।"],"answer":0,"explanation":"** कारण सीधे बताता है कि गिरने से चुंबक की चुंबकीय शक्ति प्रभावित हो सकती है।"},{"id":125,"q":"Q125.\n\n**कथन (A):** चुंबकीय पदार्थ चुंबक द्वारा आकर्षित होते हैं।\n**कारण (R):** लोहा, निकिल और कोबाल्ट चुंबकीय पदार्थों के उदाहरण हैं।","options":["कथन (A) और कारण (R) दोनों सही हैं तथा कारण (R), कथन (A) की सही व्याख्या करता है।","कथन (A) और कारण (R) दोनों सही हैं, लेकिन कारण (R), कथन (A) की सही व्याख्या नहीं करता है।","कथन (A) सही है, लेकिन कारण (R) गलत है।","कथन (A) गलत है, लेकिन कारण (R) सही है।","कथन (A) और कारण (R) दोनों गलत हैं।"],"answer":1,"explanation":"** दोनों कथन सही हैं, लेकिन कारण केवल उदाहरण देता है; यह कथन की सामान्य परिभाषा की सीधी व्याख्या नहीं है। \n\n# Section E – Case/Scenario Based MCQs (Q126–Q150)"},{"id":126,"q":"Q126. केस:\n\nराहुल को दो वस्तुएँ दी गईं—लोहे की गेंद और लकड़ी का टुकड़ा। उसने दोनों को चुंबक के पास लाया। लोहे की गेंद चुंबक की ओर खिंच गई, जबकि लकड़ी के टुकड़े पर ऐसा प्रभाव नहीं पड़ा।\n\nराहुल के प्रयोग से क्या निष्कर्ष निकलता है?","options":["लोहे की गेंद चुंबकीय पदार्थ है","लकड़ी का टुकड़ा अचुंबकीय पदार्थ हो सकता है","चुंबक दोनों वस्तुओं को समान रूप से आकर्षित करता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** लोहे का चुंबक द्वारा आकर्षित होना उसके चुंबकीय होने को दर्शाता है। लकड़ी का आकर्षित न होना उसे अचुंबकीय उदाहरण बनाता है।"},{"id":127,"q":"Q127. केस:\n\nसीमा ने एक छड़ चुंबक को धागे से स्वतंत्र रूप से लटका दिया। कुछ समय बाद वह स्थिर हो गया। उसने पाया कि चुंबक का एक सिरा उत्तर दिशा और दूसरा दक्षिण दिशा की ओर है।\n\nयह प्रयोग किस गुण को दर्शाता है?","options":["चुंबक दिशा निर्धारण में सहायक है","चुंबक में दो ध्रुव होते हैं","चुंबक हमेशा उत्तर-दक्षिण दिशा में रुकता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** प्रयोग चुंबक के उत्तर-दक्षिण दिशा में स्थिर होने और उसके दो ध्रुवों के गुण को दर्शाता है।"},{"id":128,"q":"Q128. केस:\n\nअमन ने दो चुंबकों को इस तरह पास लाया कि पहले चुंबक का N ध्रुव दूसरे चुंबक के N ध्रुव के सामने था। दोनों चुंबक एक-दूसरे से दूर हटने लगे।\n\nऐसा क्यों हुआ?","options":["दोनों ध्रुव समान हैं","समान ध्रुव प्रतिकर्षित होते हैं","दोनों ध्रुव असमान हैं","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** N–N समान ध्रुव हैं और समान ध्रुवों के बीच प्रतिकर्षण होता है।"},{"id":129,"q":"Q129. केस:\n\nनेहा ने एक चुंबक के N ध्रुव को दूसरे चुंबक के S ध्रुव के पास लाया। दोनों चुंबक एक-दूसरे की ओर खिंचने लगे।\n\nइसका सही कारण क्या है?","options":["N और S असमान ध्रुव हैं","असमान ध्रुव आकर्षित होते हैं","दोनों ध्रुव समान हैं","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** N और S विपरीत ध्रुव हैं और विपरीत ध्रुवों में आकर्षण होता है।"},{"id":130,"q":"Q130. केस:\n\nएक विद्यार्थी को ऐसी लोहे की छड़ मिली जिस पर N और S का कोई चिह्न नहीं था। उसने उसे धागे से स्वतंत्र रूप से लटका दिया।\n\nउसे ध्रुव पहचानने में कौन-सा परिणाम मदद करेगा?","options":["जो सिरा उत्तर की ओर संकेत करे, वह उत्तरी ध्रुव होगा","दूसरा सिरा दक्षिणी ध्रुव होगा","चुंबक की दिशा स्थिर होने तक उसे स्वतंत्र रूप से लटकाया जा सकता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** स्वतंत्र रूप से लटकाने पर चुंबक का एक सिरा उत्तर और दूसरा दक्षिण दिशा की ओर संकेत करता है।"},{"id":131,"q":"Q131. केस:\n\nएक छात्र ने लोहे के बुरादे को कागज पर फैलाकर उसके ऊपर छड़ चुंबक रखा। उसने देखा कि बुरादा दोनों सिरों के पास अधिक मात्रा में चिपका।\n\nइससे क्या पता चलता है?","options":["चुंबक के सिरों के पास चुंबकीय प्रभाव अधिक है","ध्रुव सिरों के पास होते हैं","चुंबक का मध्य भाग सबसे अधिक शक्तिशाली है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** लोहे के बुरादे का अधिक मात्रा में सिरों के पास चिपकना ध्रुवों के आसपास अधिक चुंबकीय प्रभाव को दर्शाता है।"},{"id":132,"q":"Q132. केस:\n\nएक बच्चा रेत में चुंबक रगड़ता है और चुंबक निकालने पर कुछ छोटे कण उसके साथ चिपके पाता है।\n\nइन कणों के बारे में क्या जाँचा जा सकता है?","options":["उनमें लौह कण हो सकते हैं","चुंबक उन्हें आकर्षित कर रहा है","गतिविधि से रेत में लौह कणों की उपस्थिति का पता लगाया जा सकता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** अध्याय की गतिविधि में चुंबक को रेत/मिट्टी में रगड़कर चिपके कणों से लौह कणों की उपस्थिति का पता लगाने की बात है।"},{"id":133,"q":"Q133. केस:\n\nरीना ने लोहे की एक छड़ को चुंबक बनाने का प्रयास किया। उसने चुंबक के एक ध्रुव को छड़ के एक सिरे से दूसरे सिरे तक ले जाकर फिर उसे वापस उसी दिशा में प्रयोग किया। उसने यह प्रक्रिया कई बार दोहराई।\n\nउसने कौन-सी सही विधि अपनाई?","options":["एक ही ध्रुव का उपयोग","एक ही दिशा में रगड़ना","प्रक्रिया को बार-बार दोहराना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** पाठ में लोहे की छड़ को चुंबक बनाने के लिए एक ही ध्रुव से एक ही दिशा में बार-बार रगड़ने की विधि दी गई है।"},{"id":134,"q":"Q134. केस:\n\nएक विद्यार्थी ने चुंबक बनाने की प्रक्रिया में हर बार चुंबक का अलग-अलग ध्रुव इस्तेमाल किया और रगड़ने की दिशा भी बदलता रहा।\n\nउसकी प्रक्रिया में क्या समस्या है?","options":["यह अध्याय में बताई गई विधि के अनुरूप नहीं है","चुंबक का ध्रुव और रगड़ने की दिशा नहीं बदलनी चाहिए","उसे एक ही दिशा में रगड़ना चाहिए","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** अध्याय में चुंबक बनाने के दौरान चुंबक के ध्रुव और रगड़ने की दिशा को न बदलने की सावधानी दी गई है।"},{"id":135,"q":"Q135. केस:\n\nमोहन ने अपने चुंबक को गर्म किया और कुछ समय बाद उसकी चुंबकीय शक्ति पहले जैसी नहीं रही।\n\nइस घटना को अध्याय के आधार पर कैसे समझेंगे?","options":["गर्म करने से चुंबक अपने गुण खो सकता है","चुंबक को गर्म करना सुरक्षित नहीं है","गर्म करने से चुंबकीय गुण हमेशा बढ़ते हैं","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** अध्याय की चेतावनी के अनुसार चुंबक को गर्म करने पर वह अपने चुंबकीय गुण खो सकता है।"},{"id":136,"q":"Q136. केस:\n\nएक बच्चे ने चुंबक को हथौड़े से पीटा। बाद में उसने पाया कि चुंबक पहले की तरह काम नहीं कर रहा।\n\nसबसे उचित निष्कर्ष क्या है?","options":["हथौड़े से पीटने से चुंबकीय गुण प्रभावित हो सकते हैं","हथौड़े से पीटने से चुंबक हमेशा शक्तिशाली होता है","चुंबक को सावधानी से रखना चाहिए","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** पहला और तीसरा कथन अध्याय की सावधानी के अनुरूप हैं। हथौड़े से पीटने से चुंबकीय गुण खो सकते हैं।"},{"id":137,"q":"Q137. केस:\n\nएक छात्र ने चुंबक को ऊँचाई से गिरा दिया और बाद में उसकी आकर्षण क्षमता कम हो गई।\n\nइसका कारण क्या हो सकता है?","options":["गिराने से चुंबकीय गुण प्रभावित हो सकते हैं","चुंबक को ऊँचाई से गिराने से बचना चाहिए","गिराने से चुंबकीय शक्ति निश्चित रूप से बढ़ती है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** अध्याय में ऊँचाई से गिराने को चुंबक के गुणों के लिए हानिकारक बताया गया है।"},{"id":138,"q":"Q138. केस:\n\nसोनू ने चुंबक को मोबाइल और कंप्यूटर के पास रख दिया।\n\nअध्याय के अनुसार उचित सलाह क्या होगी?","options":["चुंबक को मोबाइल से दूर रखें","चुंबक को कंप्यूटर से दूर रखें","चुंबक को ऐसे उपकरणों से दूर रखना चाहिए","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** पाठ में चुंबक को मोबाइल, कंप्यूटर, टेलीविजन, म्यूजिक सिस्टम और CD आदि से दूर रखने की सलाह दी गई है।"},{"id":139,"q":"Q139. केस:\n\nएक दुकानदार ने नाल चुंबक को रखने के लिए उसके दोनों ध्रुवों के पास लोहे के टुकड़े लगाए।\n\nउसने ऐसा क्यों किया?","options":["सुरक्षित भंडारण के लिए","चुंबक के ध्रुवों की सुरक्षा के लिए","चुंबक को गर्म करने के लिए","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** अध्याय में नाल चुंबक के ध्रुवों के संपर्क में लोहे का टुकड़ा रखने को सुरक्षित भंडारण का उपाय बताया गया है।"},{"id":140,"q":"Q140. केस:\n\nएक छात्र ने कंपास को मेज पर रखा। उसकी चुंबकीय सुई घूमने के बाद स्थिर हो गई।\n\nइसका क्या अर्थ है?","options":["सुई उत्तर-दक्षिण दिशा निर्धारित करने में सक्षम है","सुई चुंबकीय है","कंपास दिशा निर्धारण में उपयोगी है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** कंपास की चुंबकीय सुई स्वतंत्र रूप से घूमकर उत्तर-दक्षिण दिशा में स्थिर होती है और दिशा निर्धारण में सहायता करती है।"},{"id":141,"q":"Q141. केस:\n\nएक यात्री के पास कंपास नहीं है, लेकिन उसके पास एक चुंबक है। वह चुंबक को धागे से स्वतंत्र रूप से लटका देता है।\n\nदिशा जानने के लिए वह क्या देखेगा?","options":["चुंबक के स्थिर होने की दिशा","उत्तर की ओर संकेत करने वाला सिरा","दक्षिण की ओर संकेत करने वाला सिरा","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** स्वतंत्र रूप से लटका चुंबक उत्तर-दक्षिण दिशा में रुकता है। इसके दोनों सिरों से दोनों दिशाओं की पहचान की जा सकती है।"},{"id":142,"q":"Q142. केस:\n\nएक बच्चा दो चुंबकों को पास लाता है। पहले प्रयोग में N–N और दूसरे में N–S ध्रुव सामने हैं।\n\nदोनों प्रयोगों में क्या परिणाम अपेक्षित है?","options":["N–N में प्रतिकर्षण","N–S में आकर्षण","दोनों में आकर्षण","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"** N–N समान ध्रुव होने के कारण प्रतिकर्षित होंगे, जबकि N–S असमान ध्रुव होने के कारण आकर्षित होंगे। इसलिए प्रश्न में केवल A और B सही हैं; दिए गए विकल्पों में इसका आशय D से होना चाहिए। **सही उत्तर: D. उपर्युक्त में से एक से अधिक सही हैं।**"},{"id":143,"q":"Q143. केस:\n\nएक शिक्षक ने विद्यार्थियों को दो समान दिखने वाली लोहे की छड़ें दीं। इनमें से एक चुंबक थी और दूसरी साधारण लोहे की छड़।\n\nबिना किसी अन्य उपकरण के दोनों में अंतर जानने का उचित तरीका क्या है?","options":["दोनों के ध्रुवों को पास लाकर आकर्षण/प्रतिकर्षण देखना","चुंबक के दिशा-सूचक गुण का उपयोग करना","केवल रंग देखकर पहचानना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** चुंबक के ध्रुवीय व्यवहार और स्वतंत्र रूप से लटकाने पर दिशा बताने वाले गुण का उपयोग पहचान के लिए किया जा सकता है। केवल रंग पर्याप्त आधार नहीं है।"},{"id":144,"q":"Q144. केस:\n\nएक छात्र ने लोहे की छड़ को चुंबक से रगड़कर चुंबक बनाने के बाद पिन के पास ले गया। पिन छड़ की ओर आकर्षित हुई।\n\nइससे क्या संकेत मिलता है?","options":["लोहे की छड़ में चुंबकीय गुण आ गए हैं","छड़ चुंबकित हो गई हो सकती है","प्रक्रिया का प्रभाव हुआ है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** चुंबक बनाने की प्रक्रिया के बाद यदि लोहे की छड़ लोहे की वस्तु को आकर्षित करती है, तो यह उसके चुंबकीय गुण प्राप्त करने का संकेत है।"},{"id":145,"q":"Q145. केस:\n\nएक छात्र ने छड़ चुंबक को लोहे के बुरादे में रखा और देखा कि बुरादा बीच की तुलना में सिरों पर ज्यादा है।\n\nवह कौन-सा निष्कर्ष निकाले?","options":["ध्रुव सिरों के पास हैं","सिरों पर चुंबकीय प्रभाव अधिक है","मध्य भाग सबसे अधिक प्रभावी है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** लोहे के बुरादे की अधिक मात्रा सिरों के पास होना ध्रुवों और अधिक चुंबकीय प्रभाव की ओर संकेत करता है।"},{"id":146,"q":"Q146. केस:\n\nएक छात्र ने एक चुंबक को कई बार अलग-अलग दिशाओं में घुमाकर छोड़ा। हर बार वह कुछ समय बाद एक निश्चित दिशा में रुक गया।\n\nइससे कौन-सा चुंबकीय गुण सिद्ध होता है?","options":["चुंबक दिशा निर्धारित कर सकता है","चुंबक उत्तर-दक्षिण दिशा में रुकता है","चुंबक के दो ध्रुव होते हैं","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** प्रयोग चुंबक के दिशा-सूचक व्यवहार को दर्शाता है। उत्तर-दक्षिण दिशा में रुकना उसके ध्रुवों के व्यवहार से जुड़ा है।"},{"id":147,"q":"Q147. केस:\n\nएक बच्चा कहता है कि नाल चुंबक को सुरक्षित रखने के लिए उसे बार-बार हथौड़े से पीटना चाहिए।\n\nउसकी बात के बारे में क्या सही है?","options":["उसकी बात गलत है","हथौड़े से पीटने पर चुंबक अपने गुण खो सकता है","चुंबक को सावधानी से रखना चाहिए","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** हथौड़े से पीटना चुंबक के लिए हानिकारक है। अध्याय सुरक्षित भंडारण और सावधानी बरतने पर जोर देता है।"},{"id":148,"q":"Q148. केस:\n\nएक विद्यार्थी ने पाया कि उसकी चुंबकीय सुई उत्तर-दक्षिण दिशा में स्थिर नहीं हो रही। पास में एक बड़ा चुंबक रखा हुआ था।\n\nसबसे उचित कारण क्या हो सकता है?","options":["पास का चुंबक सुई को प्रभावित कर रहा हो सकता है","चुंबकीय सुई की दिशा प्रभावित हो सकती है","कंपास को चुंबकीय वस्तुओं से दूर रखना उपयोगी हो सकता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** कंपास की सुई स्वयं चुंबकीय होती है, इसलिए पास के चुंबक का प्रभाव उसकी दिशा को प्रभावित कर सकता है। अध्याय कंपास और चुंबकीय गुणों के संबंध को स्पष्ट करता है।"},{"id":149,"q":"Q149. केस:\n\nएक विद्यार्थी ने दो चुंबकों के ध्रुवों को मिलाकर देखा। उसने पाया कि कुछ स्थितियों में चुंबक एक-दूसरे की ओर खिंचते हैं और कुछ स्थितियों में दूर हटते हैं।\n\nइससे वह कौन-सा नियम निष्कर्षित कर सकता है?","options":["समान ध्रुव प्रतिकर्षित करते हैं","असमान ध्रुव आकर्षित करते हैं","चुंबकीय ध्रुवों का व्यवहार उनकी प्रकृति पर निर्भर करता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** N–N/S–S जैसे समान ध्रुव प्रतिकर्षित होते हैं, जबकि N–S जैसे असमान ध्रुव आकर्षित होते हैं।"},{"id":150,"q":"Q150. केस:\n\nएक शिक्षक ने विद्यार्थियों को अध्याय के अंत में एक प्रश्न दिया: “ऐसा चुंबकीय यंत्र कौन-सा है जिसकी सहायता से किसी स्थान की दिशा ज्ञात की जा सकती है?” विद्यार्थी ने कंपास का उत्तर दिया।\n\nउसका उत्तर क्यों सही है?","options":["कंपास में चुंबकीय सुई होती है","चुंबकीय सुई स्थिर होकर उत्तर-दक्षिण दिशा बताती है","कंपास दिशा निर्धारण के लिए उपयोग किया जाता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"** कंपास की चुंबकीय सुई धुरी पर स्वतंत्र रूप से घूमती है और स्थिर होने पर उत्तर-दक्षिण दिशा दर्शाती है। इसी कारण कंपास दिशा निर्धारण में उपयोगी है। \n\n**Chapter 10 के 150 MCQs पूरे हुए — Q1 से Q150 तक continuous numbering के साथ।**\nऔर हाँ, **Section A/B/C/E के हर प्रश्न में D और E दोनों options जोड़े गए हैं**, जैसा तुमने कहा था।"}]
const sections=[{"name":"Section A — Basic / Direct NCERT Questions","start":1,"end":35},{"name":"Section B — Concept Based Questions","start":36,"end":70},{"name":"Section C — Statement Based Questions","start":71,"end":105},{"name":"Section D — Assertion–Reason Questions","start":106,"end":125},{"name":"Section E — Case / Scenario Based Questions","start":126,"end":150}];

let selectedSection=null;
let quiz=[];
let currentIndex=0;
let answers={};
let checked={};
let reviewMode=false;

function goHome(){
 document.getElementById("home").classList.remove("hidden");
 document.getElementById("setup").classList.add("hidden");
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 selectedSection=null;quiz=[];currentIndex=0;answers={};checked={};reviewMode=false;
 window.scrollTo(0,0);
}

function renderSections(){
 const box=document.getElementById("sectionsList");
 box.innerHTML="";
 sections.forEach((s,i)=>{
  const d=document.createElement("div");
  d.className="section";
  d.innerHTML=`<div class="section-title">${s.name}</div><div class="section-count">${s.end-s.start+1} Questions</div>`;
  d.onclick=()=>startSection(i);
  box.appendChild(d);
 });
}

function startSection(i){
 selectedSection=sections[i];
 const list=questions.slice(selectedSection.start-1,selectedSection.end);
 document.getElementById("home").classList.add("hidden");
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("setup").classList.remove("hidden");

 document.getElementById("setupTitle").textContent=selectedSection.name;
 document.getElementById("setupInfo").textContent=`${list.length} MCQs available`;

 const sel=document.getElementById("questionCount");
 sel.innerHTML="";
 [5,10,20,list.length].forEach(n=>{
  if(n<=list.length && !Array.from(sel.options).some(o=>Number(o.value)===n)){
   const o=document.createElement("option");
   o.value=n;
   o.textContent=n===list.length?`All ${n} Questions`:`${n} Questions`;
   sel.appendChild(o);
  }
 });
 // IMPORTANT: default हमेशा पूरे section की question count रहेगी
 sel.value=String(list.length);
 window.scrollTo(0,0);
}

function startPractice(){
 const list=questions.slice(selectedSection.start-1,selectedSection.end)
   .map((q,i)=>({...q,_id:selectedSection.start+i}));
 const count=Number(document.getElementById("questionCount").value);

 quiz=list.slice(0,count);
 currentIndex=0;
 answers={};
 checked={};
 reviewMode=false;

 document.getElementById("setup").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 render();
 window.scrollTo(0,0);
}

function render(){
 const q=quiz[currentIndex];
 if(!q)return;

 document.getElementById("sectionName").textContent=selectedSection.name;
 document.getElementById("counter").textContent=`Question ${currentIndex+1} of ${quiz.length}`;
 document.getElementById("attempted").textContent=`Attempted: ${Object.keys(answers).length}/${quiz.length}`;
 document.getElementById("question").textContent=`Q${q._id}. ${q.q}`;

 const box=document.getElementById("options");
 box.innerHTML="";
 document.getElementById("feedback").textContent="";
 document.getElementById("explanation").classList.add("hidden");
 document.getElementById("explanation").innerHTML="";

 q.options.forEach((opt,i)=>{
  const b=document.createElement("button");
  b.type="button";
  b.className="option";
  b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${opt}`;

  const selected=answers[q._id];
  if(selected===i)b.classList.add("selected");

  if(checked[q._id] || reviewMode){
   b.disabled=true;
   if(i===q.answer)b.classList.add("correct");
   if(selected===i && i!==q.answer)b.classList.add("wrong");
  }else{
   b.onclick=()=>{
    answers[q._id]=i;
    render();
   };
  }
  box.appendChild(b);
 });

 if(checked[q._id] || reviewMode){
  const f=document.getElementById("feedback");
  if(selectedAnswerExists(q)){
   f.textContent=answers[q._id]===q.answer
     ?"✅ सही उत्तर!"
     :`❌ गलत। सही उत्तर: ${String.fromCharCode(65+q.answer)}`;
   f.style.color=answers[q._id]===q.answer?"#15803d":"#b91c1c";
  }else{
   f.textContent=`⚪ Unattempted. सही उत्तर: ${String.fromCharCode(65+q.answer)}`;
   f.style.color="#536579";
  }

  document.getElementById("explanation").innerHTML=
    `<div class="explanation-title">💡 Explanation</div>${formatExplanation(q.explanation)}`;
  document.getElementById("explanation").classList.remove("hidden");
 }

 renderPalette();
 document.getElementById("prevBtn").disabled=currentIndex===0;
 document.getElementById("nextBtn").disabled=currentIndex===quiz.length-1;
 document.getElementById("checkBtn").disabled=reviewMode || !!checked[q._id] || answers[q._id]===undefined;
 document.getElementById("submitBtn").style.display=reviewMode?"none":"inline-block";
}

function selectedAnswerExists(q){
 return answers[q._id]!==undefined;
}

function formatExplanation(s){
 return s.replace(/\n/g,"<br>");
}

function renderPalette(){
 const p=document.getElementById("palette");
 p.innerHTML="<h3>Question Palette</h3>";
 const g=document.createElement("div");
 g.className="pal-grid";

 quiz.forEach((q,i)=>{
  const b=document.createElement("button");
  b.className="pal";
  b.type="button";
  b.textContent=q._id;
  if(i===currentIndex)b.classList.add("active");
  if(answers[q._id]!==undefined)b.classList.add("done");
  b.onclick=()=>{
   currentIndex=i;
   render();
   window.scrollTo(0,0);
  };
  g.appendChild(b);
 });
 p.appendChild(g);
}

document.getElementById("prevBtn").onclick=()=>{
 if(currentIndex>0){
  currentIndex--;
  render();
  window.scrollTo(0,0);
 }
};

document.getElementById("nextBtn").onclick=()=>{
 if(currentIndex<quiz.length-1){
  currentIndex++;
  render();
  window.scrollTo(0,0);
 }
};

document.getElementById("checkBtn").onclick=()=>{
 const q=quiz[currentIndex];
 if(answers[q._id]===undefined)return;
 checked[q._id]=true;
 render();
};

document.getElementById("submitBtn").onclick=()=>{
 if(confirm("क्या आप अपना test submit करना चाहते हैं?"))showResult();
};

function showResult(){
 let correct=0,attempted=Object.keys(answers).length;
 quiz.forEach(q=>{
  if(answers[q._id]===q.answer)correct++;
 });
 let wrong=Object.keys(answers).filter(id=>{
  const q=quiz.find(x=>String(x._id)===String(id));
  return q && answers[id]!==q.answer;
 }).length;

 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 document.getElementById("resultText").innerHTML=
 `<div><b>Score:</b> ${correct} / ${quiz.length}</div>
  <div>🟢 Correct: ${correct}</div>
  <div>🔴 Wrong: ${wrong}</div>
  <div>⚪ Unattempted: ${quiz.length-attempted}</div>
  <div>📊 Attempted: ${attempted}</div>`;

 window.scrollTo(0,0);
}

document.getElementById("reviewBtn").onclick=()=>{
 reviewMode=true;
 currentIndex=0;
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 render();
 window.scrollTo(0,0);
};

// Keyboard shortcuts: N = Next, P = Previous
document.addEventListener("keydown",(e)=>{
  const tag=document.activeElement?.tagName;
  if(tag==="INPUT" || tag==="TEXTAREA" || tag==="SELECT") return;

  const key=e.key.toLowerCase();

  if(key==="n" && currentIndex<quiz.length-1){
    e.preventDefault();
    currentIndex++;
    render();
    window.scrollTo(0,0);
  }

  if(key==="p" && currentIndex>0){
    e.preventDefault();
    currentIndex--;
    render();
    window.scrollTo(0,0);
  }
});

document.getElementById("homeBtn").onclick=goHome;

renderSections();
</script>
</body>
</html>
