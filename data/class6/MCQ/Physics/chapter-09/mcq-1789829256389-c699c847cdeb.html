<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>विद्युत तथा परिपथ | MCQ Practice</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#172b4d;line-height:1.6}
.container{max-width:1100px;margin:auto;padding:24px 20px}
.card{background:#fff;border-radius:18px;box-shadow:0 5px 18px rgba(0,0,0,.08)}
.hidden{display:none!important}
h1,h2,h3{margin-top:0}
button,select{font:inherit}
button{border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.home{padding:28px}
.home h1{font-size:32px;margin-bottom:6px}
.sub{color:#536579;font-size:18px}
.section{border:1px solid #d4dae2;border-radius:12px;padding:17px 20px;margin:12px 0;cursor:pointer;background:#fafbfc}
.section:hover{background:#f5f8fc}
.section-title{font-size:20px;font-weight:700;color:#111}
.section-count{color:#536579}
.setup{padding:28px}
.question-select-row{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.question-select-row label{font-size:18px;white-space:nowrap}
.back{display:inline-block;color:#2563eb;text-decoration:none;font-weight:700;margin-bottom:18px}
select{padding:10px 14px;border:1px solid #ccc;border-radius:8px;margin-left:8px}
.next{background:#16a34a;color:#fff}
.prev{background:#6b7280;color:#fff}
.submit{background:#2563eb;color:#fff}
.quiz-topbar{margin:0 0 14px}
.topics-back{padding:12px 18px;border:1px solid #d1d5db;border-radius:10px;background:#f5f5f5;color:#111827;font-size:16px;cursor:pointer}
.topics-back:hover{background:#e5e7eb}
.quiz-header{padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.quiz-header strong{font-size:18px}
.question-card{padding:26px;margin-bottom:18px}
.question{font-size:22px;font-weight:700;margin-bottom:20px;white-space:pre-line}
.option{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px;border:2px solid #e1e5ea;background:#fff;border-radius:10px}
.option:hover{border-color:#2563eb;background:#eff6ff}
.option.selected{border-color:#2563eb;background:#dbeafe}
.option.correct{border-color:#16a34a;background:#dcfce7}
.option.wrong{border-color:#dc2626;background:#fee2e2}
.feedback{min-height:28px;font-weight:700;margin-top:12px}
.explanation{margin-top:14px;padding:16px 18px;border-left:5px solid #2563eb;border-radius:10px;background:#eff6ff;color:#172b4d;font-size:16px;line-height:1.65}
.explanation-title{font-weight:700;font-size:18px;margin-bottom:6px}
.bottom{padding:18px 24px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}
.palette{padding:20px 24px}
.pal-grid{display:flex;flex-wrap:wrap;gap:8px}
.pal{background:#fff;border:1px solid #d4dae2;width:58px;min-width:58px;height:52px;padding:8px 4px}
.pal.active{outline:3px solid #2563eb}
.pal.done{background:#dbeafe}
.result{padding:32px;text-align:center}
.stat{font-size:18px;line-height:2}
.review-card{margin-top:16px;padding:22px;text-align:left}
.review-q{font-size:20px;font-weight:700}
.review-option{padding:10px 12px;margin:7px 0;border-radius:8px;border:1px solid #ddd}
.review-option.correct{background:#dcfce7;border-color:#16a34a}
.review-option.wrong{background:#fee2e2;border-color:#dc2626}
@media(max-width:650px){
.container{padding:14px}
.home h1{font-size:26px}
.question{font-size:19px}
.quiz-header,.bottom{flex-direction:column;align-items:stretch}
.bottom button{margin:4px 0}
.pal{width:50px;min-width:50px;height:48px}
}
</style>
</head>
<body>
<div class="container">
<div id="home" class="card home">
<h1>📚 विद्युत तथा परिपथ MCQ Practice</h1>
<div class="sub">Class 6 Physics • 150 MCQs • 5 Sections</div>
<div id="sectionsList"></div>
</div>

<div id="setup" class="card setup hidden">
<a href="#" class="back" onclick="goHome();return false;">← Back to Sections</a>
<h2 id="setupTitle"></h2>
<p class="sub" id="setupInfo"></p>
<div class="question-select-row">
<label><b>Questions:</b></label>
<select id="questionCount"></select>
</div>
<br><br>
<button class="next" onclick="startPractice()">🚀 Start Practice</button>
</div>

<div id="quiz" class="hidden">
<div class="quiz-topbar">
<button class="topics-back" onclick="goHome()">← Topics</button>
</div>
<div class="card quiz-header">
<strong id="sectionName"></strong>
<div id="counter"></div>
<div id="attempted"></div>
</div>

<div class="card question-card">
<div class="question" id="question"></div>
<div id="options"></div>
<div class="feedback" id="feedback"></div>
<div class="explanation hidden" id="explanation"></div>
</div>

<div class="card bottom">
<div>
<button class="prev" id="prevBtn">← Previous</button>
<button class="submit" id="checkBtn">Check Answer</button>
<button class="next" id="nextBtn">Next →</button>
</div>
<button class="submit" id="submitBtn">Submit Test</button>
</div>

<div class="card palette">
<h3>Question Palette</h3>
<div class="pal-grid" id="palette"></div>
</div>
</div>

<div id="result" class="card result hidden">
<h2>🎯 Test Result</h2>
<div class="stat" id="resultText"></div>
<br>
<button class="next" id="reviewBtn">👁️ Review Answers</button>
<button class="prev" id="homeBtn">Choose Section</button>
</div>
</div>

<script>
const questions=[{"id":1,"q":"Q1. विद्युत-सेल का उपयोग किस रूप में किया जाता है?","options":["विद्युत-स्रोत के रूप में","केवल प्रकाश-स्रोत के रूप में","केवल ताप-स्रोत के रूप में","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"विद्युत-सेल विद्युत का स्रोत होता है। अध्याय में इसे टॉर्च, अलार्म घड़ी, कलाई घड़ी, रेडियो और कैमरा जैसी युक्तियों में विद्युत-स्रोत के रूप में बताया गया है।"},{"id":2,"q":"Q2. विद्युत-सेल के कितने सिरे (Terminal) होते हैं?","options":["एक","दो","तीन","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"प्रत्येक विद्युत-सेल में दो Terminal होते हैं—एक धनात्मक (+) और दूसरा ऋणात्मक (–)।"},{"id":3,"q":"Q3. विद्युत-सेल का धनात्मक सिरा किस चिह्न से दर्शाया जाता है?","options":["+","–","×","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"सेल के धनात्मक Terminal को (+) चिह्न से तथा ऋणात्मक Terminal को (–) चिह्न से दर्शाया जाता है।"},{"id":4,"q":"Q4. विद्युत-सेल का ऋणात्मक सिरा किस चिह्न से दर्शाया जाता है?","options":["+","–","=","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"विद्युत-सेल के दो सिरों में एक ऋणात्मक Terminal होता है, जिसे (–) चिह्न से दर्शाया जाता है।"},{"id":5,"q":"Q5. विद्युत-सेल में विद्युत किससे उत्पन्न होती है?","options":["संचित रासायनिक पदार्थों से","केवल तार से","केवल काँच से","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"विद्युत-सेल में संचित रासायनिक पदार्थों से विद्युत उत्पन्न होती है। जब ये रासायनिक पदार्थ उपयोग हो जाते हैं, तो सेल विद्युत उत्पन्न करना बंद कर देता है।"},{"id":6,"q":"Q6. टॉर्च के बल्ब को विद्युत किससे मिलती है?","options":["विद्युत-सेल से","प्लास्टिक से","काँच से","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"टॉर्च के बल्ब को विद्युत विद्युत-सेल से प्राप्त होती है। टॉर्च में सेल विद्युत का स्रोत होता है।"},{"id":7,"q":"Q7. बल्ब के भीतर प्रकाश उत्पन्न करने वाले पतले तार को क्या कहते हैं?","options":["टर्मिनल","तंतु (Filament)","स्विच","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"बल्ब के अंदर लगा पतला तार जो प्रकाश उत्सर्जित करता है, उसे बल्ब का तंतु (Filament) कहा जाता है।"},{"id":8,"q":"Q8. बल्ब के तंतु को आधार कौन प्रदान करता है?","options":["दो मोटे तार","केवल काँच","केवल प्लास्टिक","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"बल्ब का तंतु दो मोटे तारों के बीच लगा होता है और ये मोटे तार तंतु को आधार प्रदान करते हैं।"},{"id":9,"q":"Q9. बल्ब के आधार पर धातु का ढाँचा और धातु की नोक क्या होती हैं?","options":["बल्ब के दो Terminal","बल्ब के दो तंतु","दो स्विच","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"बल्ब के आधार पर धातु का ढाँचा तथा धातु की नोक उसके दो Terminal होते हैं। दोनों Terminal एक-दूसरे को स्पर्श नहीं करते।"},{"id":10,"q":"Q10. विद्युत-परिपथ किसे दर्शाता है?","options":["विद्युत-प्रवाह का संपूर्ण पथ","केवल बल्ब का आकार","केवल सेल का आकार","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"विद्युत-परिपथ विद्युत-सेल के दोनों Terminal के बीच विद्युत-धारा के संपूर्ण पथ को दर्शाता है।"},{"id":11,"q":"Q11. बल्ब कब दीप्तिमान होता है?","options":["जब परिपथ में विद्युत-धारा प्रवाहित होती है","जब परिपथ खुला होता है","जब तार टूट जाता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"बंद विद्युत-परिपथ में विद्युत-धारा प्रवाहित होने पर बल्ब का तंतु धारा प्राप्त करता है और बल्ब दीप्तिमान होता है।"},{"id":12,"q":"Q12. विद्युत-धारा की दिशा किस Terminal से किस Terminal की ओर मानी गई है?","options":["+ से –","– से +","दोनों दिशाओं में समान","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"अध्याय के अनुसार विद्युत-परिपथ में विद्युत-धारा की दिशा विद्युत-सेल के (+) Terminal से (–) Terminal की ओर होती है।"},{"id":13,"q":"Q13. बल्ब के नहीं जलने का एक कारण क्या हो सकता है?","options":["बल्ब का तंतु टूट जाना","बल्ब का काँच होना","तार का धातु होना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"यदि बल्ब का तंतु टूट जाता है तो परिपथ टूट जाता है। परिणामस्वरूप विद्युत-धारा तंतु से होकर नहीं गुजरती और बल्ब नहीं जलता।"},{"id":14,"q":"Q14. विद्युत-स्विच का मुख्य कार्य क्या है?","options":["परिपथ को जोड़ना या तोड़ना","विद्युत-सेल बनाना","बल्ब का तंतु बनाना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"स्विच एक सरल युक्ति है जो विद्युत-परिपथ को जोड़ या तोड़ सकती है। इससे विद्युत-धारा को प्रारंभ या बंद किया जाता है।"},{"id":15,"q":"Q15. स्विच की ‘ON’ अवस्था में क्या होता है?","options":["परिपथ पूरा होता है","परिपथ टूट जाता है","धारा हमेशा रुक जाती है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"ON स्थिति में स्विच के संपर्क जुड़ जाते हैं, जिससे परिपथ पूरा हो जाता है और विद्युत-धारा प्रवाहित हो सकती है।"},{"id":16,"q":"Q16. स्विच की ‘OFF’ अवस्था में क्या होता है?","options":["परिपथ पूरा रहता है","परिपथ पूरा नहीं रहता","बल्ब अनिवार्य रूप से जलता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":1,"explanation":"OFF स्थिति में स्विच के संपर्कों के बीच रिक्त स्थान रहता है। इससे परिपथ पूरा नहीं होता और विद्युत-धारा प्रवाहित नहीं होती।"},{"id":17,"q":"Q17. निम्न में से कौन विद्युत-चालक है?","options":["ताँबा","रबर","प्लास्टिक","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"ताँबा धातु है और विद्युत-धारा को अपने अंदर से प्रवाहित होने देता है, इसलिए यह विद्युत-चालक है। अध्याय में तार बनाने के लिए ताँबा और एल्युमिनियम जैसी धातुओं के प्रयोग का उल्लेख है।"},{"id":18,"q":"Q18. निम्न में से कौन विद्युत-रोधक है?","options":["रबर","ताँबा","लोहा","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"रबर विद्युत-धारा को अपने अंदर से प्रवाहित नहीं होने देता, इसलिए इसे विद्युत-रोधक कहा जाता है।"},{"id":19,"q":"Q19. विद्युत-चालक किसे कहते हैं?","options":["जिन पदार्थों से होकर विद्युत-धारा प्रवाहित हो सकती है","जिन पदार्थों से धारा बिल्कुल नहीं गुजरती","केवल पारदर्शी पदार्थों को","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"जो पदार्थ अपने अंदर से विद्युत-धारा को प्रवाहित होने देते हैं, वे विद्युत-चालक कहलाते हैं।"},{"id":20,"q":"Q20. विद्युत-रोधक किसे कहते हैं?","options":["जिन पदार्थों से विद्युत-धारा प्रवाहित नहीं हो सकती","सभी धातुओं को","केवल तारों को","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"जो पदार्थ विद्युत-धारा को अपने अंदर से प्रवाहित नहीं होने देते, वे विद्युत-रोधक कहलाते हैं।"},{"id":21,"q":"Q21. निम्न में से किसका उपयोग तारों को बनाने में किया जाता है?","options":["ताँबा","एल्युमिनियम","अन्य धातुएँ","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"अध्याय में ताँबा, एल्युमिनियम तथा अन्य धातुओं को तार बनाने के लिए उपयोगी बताया गया है क्योंकि ये विद्युत-चालक हैं।"},{"id":22,"q":"Q22. मानव शरीर विद्युत का कैसा चालक है?","options":["अच्छा चालक","अच्छा रोधक","पूर्णतः रोधक","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"NCERT में स्पष्ट चेतावनी दी गई है कि मानव शरीर विद्युत का बहुत अच्छा चालक है। इसलिए विद्युत उपकरणों का उपयोग सावधानी से करना चाहिए।"},{"id":23,"q":"Q23. विद्युत-परिपथ को पूरा करने के लिए सामान्यतः किसका उपयोग किया गया है?","options":["धातु के तार","ऊन की डोरी","कागज","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"अध्याय की गतिविधियों में परिपथ पूरा करने के लिए धातु के तारों का प्रयोग किया गया है क्योंकि धातुएँ विद्युत-चालक होती हैं।"},{"id":24,"q":"Q24. निम्न में से कौन विद्युत-रोधक पदार्थ है?","options":["काँच","रबर","प्लास्टिक","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"काँच, रबर और प्लास्टिक विद्युत-धारा के प्रवाह को रोकने वाले पदार्थों के उदाहरण हैं। NCERT में इनका उपयोग विद्युत उपकरणों के उन भागों में बताया गया है जिन्हें लोग छू सकते हैं।"},{"id":25,"q":"Q25. विद्युत-तारों के ऊपर प्लास्टिक का आवरण क्यों लगाया जाता है?","options":["सुरक्षा के लिए","तार को पारदर्शी बनाने के लिए","धारा को बढ़ाने के लिए","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"प्लास्टिक विद्युत-रोधक है। तार के चालक भाग को प्लास्टिक से ढकने से उसे सीधे छूने का खतरा कम होता है।"},{"id":26,"q":"Q26. रबर के दस्ताने विद्युत कार्य करते समय क्यों उपयोगी होते हैं?","options":["रबर विद्युत-रोधक है","रबर विद्युत-चालक है","रबर धारा उत्पन्न करता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"रबर विद्युत-धारा को आसानी से प्रवाहित नहीं होने देता। इसलिए विद्युत-मिस्त्री के औजारों और सुरक्षा उपकरणों में रबर या प्लास्टिक का उपयोग किया जाता है।"},{"id":27,"q":"Q27. विद्युत-बल्ब में कौन-सा भाग विद्युत-धारा से दीप्त होता है?","options":["तंतु","काँच का बाहरी आवरण","प्लास्टिक","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"बल्ब का पतला तंतु विद्युत-धारा प्रवाहित होने पर दीप्त होता है और प्रकाश उत्पन्न करता है।"},{"id":28,"q":"Q28. विद्युत-सेल के रासायनिक पदार्थ समाप्त होने पर क्या होता है?","options":["सेल विद्युत उत्पन्न करना बंद कर देता है","सेल बड़ा हो जाता है","तार अधिक मोटा हो जाता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"सेल में संचित रासायनिक पदार्थ विद्युत उत्पन्न करने में उपयोग होते हैं। उनके समाप्त होने पर सेल विद्युत उत्पन्न करना बंद कर देता है।"},{"id":29,"q":"Q29. टॉर्च में विद्युत-सेल का क्या कार्य है?","options":["विद्युत उपलब्ध कराना","प्रकाश को रोकना","बल्ब को ठंडा करना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"टॉर्च का बल्ब सेल से विद्युत प्राप्त करता है। इसलिए सेल टॉर्च के लिए विद्युत का स्रोत है।"},{"id":30,"q":"Q30. विद्युत-परिपथ में बल्ब के दो Terminal किससे जोड़े जाते हैं?","options":["विद्युत-सेल के Terminal से तार द्वारा","केवल काँच से","केवल रबर से","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"बंद परिपथ बनाने के लिए बल्ब के दोनों Terminal को तारों द्वारा सेल के दोनों Terminal से जोड़ा जाता है।"},{"id":31,"q":"Q31. यदि परिपथ में कहीं रिक्त स्थान हो तो सामान्यतः क्या होगा?","options":["विद्युत-धारा का प्रवाह रुक जाएगा","बल्ब अवश्य जलेगा","सेल तुरंत नया बन जाएगा","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"विद्युत-धारा के प्रवाह के लिए पूरा पथ आवश्यक है। परिपथ टूटने पर धारा नहीं बहती और बल्ब दीप्त नहीं होता।"},{"id":32,"q":"Q32. विद्युत-चालक परीक्षण के लिए किस युक्ति का उपयोग किया जा सकता है?","options":["चालक-परीक्षक","थर्मामीटर","दर्पण","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"अध्याय में चालक-परीक्षक का प्रयोग विभिन्न पदार्थों की विद्युत-चालकता जाँचने के लिए किया गया है। यदि पदार्थ से धारा गुजरती है तो बल्ब दीप्त हो सकता है।"},{"id":33,"q":"Q33. चालक-परीक्षक में परीक्षण किए जाने वाले पदार्थ का संबंध किससे कराया जाता है?","options":["परिपथ के खुले सिरों से","केवल सेल के बाहरी आवरण से","केवल बल्ब के काँच से","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"चालक-परीक्षक के तारों के स्वतंत्र सिरों को अलग-अलग परीक्षण किए जाने वाले पदार्थ से स्पर्श कराया जाता है।"},{"id":34,"q":"Q34. यदि परीक्षण किया गया पदार्थ विद्युत-धारा प्रवाहित करता है तो क्या संकेत मिल सकता है?","options":["बल्ब दीप्त हो सकता है","परिपथ हमेशा टूट जाएगा","सेल गायब हो जाएगा","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"चालक-परीक्षक में यदि परीक्षण किया गया पदार्थ धारा को प्रवाहित होने देता है, तो पूरा परिपथ बन सकता है और बल्ब दीप्त हो सकता है।"},{"id":35,"q":"Q35. विद्युत से संबंधित सभी गतिविधियों के लिए NCERT में किस प्रकार की बैटरी के उपयोग की चेतावनी दी गई है?","options":["साधारण बैटरी","उच्च वोल्टेज जनित्र","किसी भी खुले तार को सीधे स्रोत से जोड़ना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"अध्याय में विद्युत से संबंधित गतिविधियों के लिए केवल साधारण बैटरी का उपयोग करने की चेतावनी दी गई है। बिजली के तारों और सॉकेट आदि से प्रयोग नहीं करना चाहिए।\n\nSection B – Concept Based Questions\nप्रश्न 36–70"},{"id":36,"q":"Q36. बल्ब को सेल से जोड़ने के बाद भी वह नहीं जल रहा है। इसका संभावित कारण क्या है?","options":["परिपथ पूरा नहीं है","बल्ब का तंतु टूट गया है","दोनों","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"बल्ब तभी जलता है जब पूरा परिपथ बना हो और तंतु अखंड हो। इनमें से किसी एक स्थिति के कारण धारा तंतु से नहीं गुजर सकती।"},{"id":37,"q":"Q37. किसी परिपथ में तार के स्थान पर रबर की डोरी लगाने पर बल्ब क्यों नहीं जलेगा?","options":["रबर विद्युत-रोधक है","रबर विद्युत-चालक है","रबर धारा को उत्पन्न करता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"रबर विद्युत-धारा को अपने अंदर से प्रवाहित नहीं होने देता। इसलिए धातु के तार के स्थान पर रबर लगाने से आवश्यक विद्युत-पथ पूरा नहीं होगा।"},{"id":38,"q":"Q38. यदि स्विच के दोनों संपर्क आपस में जुड़ जाएँ तो बल्ब के जलने की संभावना क्यों बढ़ती है?","options":["परिपथ पूरा हो जाता है","सेल का आकार बढ़ जाता है","बल्ब का तंतु मोटा हो जाता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"जुड़े हुए स्विच के कारण दोनों संपर्कों के बीच का रिक्त स्थान समाप्त हो जाता है। इससे परिपथ पूरा होकर धारा प्रवाहित हो सकती है।"},{"id":39,"q":"Q39. यदि स्विच OFF हो तो बल्ब क्यों नहीं जलता?","options":["परिपथ टूट जाता है","सेल में रासायनिक पदार्थ तुरंत समाप्त हो जाते हैं","बल्ब का काँच टूट जाता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"OFF अवस्था में स्विच के संपर्क अलग रहते हैं, इसलिए परिपथ में रिक्त स्थान होता है और धारा का निरंतर प्रवाह नहीं हो पाता।"},{"id":40,"q":"Q40. बल्ब के दोनों Terminal एक-दूसरे को न छूने देने का मुख्य कारण क्या है?","options":["परिपथ की उचित व्यवस्था बनाए रखना","बल्ब को रंगीन बनाना","काँच को मजबूत करना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"बल्ब के दोनों Terminal इस प्रकार लगाए जाते हैं कि वे एक-दूसरे को स्पर्श न करें। इससे बल्ब को बाहरी परिपथ में उचित ढंग से जोड़ा जा सकता है।"},{"id":41,"q":"Q41. यदि बल्ब का तंतु टूट जाए तो विद्युत-धारा क्यों नहीं बहती?","options":["परिपथ तंतु के स्थान पर टूट जाता है","सेल का धनात्मक Terminal गायब हो जाता है","तार चालक नहीं रहता","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"तंतु परिपथ का एक महत्वपूर्ण भाग है। उसके टूटने से सेल के दोनों Terminal के बीच निरंतर विद्युत-पथ समाप्त हो जाता है।"},{"id":42,"q":"Q42. किसी पदार्थ से होकर धारा प्रवाहित हो रही है। इससे उस पदार्थ के बारे में क्या निष्कर्ष निकलेगा?","options":["वह विद्युत-चालक है","वह अनिवार्य रूप से विद्युत-रोधक है","वह केवल पारदर्शी है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"विद्युत-चालक की पहचान यही है कि वह अपने अंदर से विद्युत-धारा को गुजरने देता है।"},{"id":43,"q":"Q43. किसी पदार्थ को परिपथ में लगाने पर बल्ब नहीं जलता। सबसे उचित निष्कर्ष क्या हो सकता है?","options":["पदार्थ विद्युत-रोधक हो सकता है","पदार्थ हमेशा धातु है","पदार्थ निश्चित रूप से चालक है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"यदि अन्य सभी परिपथीय भाग ठीक हैं और केवल पदार्थ बदलने पर बल्ब नहीं जलता, तो यह संकेत हो सकता है कि वह पदार्थ विद्युत-धारा को प्रवाहित नहीं होने देता।"},{"id":44,"q":"Q44. ताँबे का तार विद्युत-परिपथ में अधिक उपयुक्त क्यों है?","options":["ताँबा विद्युत-चालक है","ताँबा विद्युत-रोधक है","ताँबा धारा को रोकता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"ताँबा विद्युत-धारा का चालक है। इसलिए परिपथ में धारा को प्रवाहित करने के लिए ताँबे के तार का उपयोग किया जा सकता है।"},{"id":45,"q":"Q45. स्विच को OFF करने का प्रभाव क्या होगा?","options":["परिपथ टूटेगा","विद्युत-धारा का प्रवाह रुक सकता है","बल्ब बुझ सकता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"OFF अवस्था में स्विच परिपथ को तोड़ देता है। इससे धारा का प्रवाह रुकता है और बल्ब बुझ जाता है।"},{"id":46,"q":"Q46. स्विच को ON करने का उद्देश्य क्या है?","options":["परिपथ पूरा करना","धारा के प्रवाह की अनुमति देना","बल्ब को दीप्त होने देना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"ON स्थिति में स्विच संपर्क स्थापित करता है। इससे पूरा परिपथ बनता है और विद्युत-धारा प्रवाहित होकर बल्ब को दीप्त कर सकती है।"},{"id":47,"q":"Q47. बिजली के उपकरणों को सावधानी से छूने की आवश्यकता क्यों है?","options":["मानव शरीर विद्युत का अच्छा चालक है","विद्युत से गंभीर चोट हो सकती है","लापरवाही से मृत्यु भी हो सकती है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"NCERT चेतावनी देता है कि मानव शरीर अच्छा चालक है और विद्युत का अनुचित उपयोग गंभीर चोट या मृत्यु तक का कारण बन सकता है।"},{"id":48,"q":"Q48. यदि सेल के दोनों Terminal को बिना बल्ब या स्विच जैसी युक्ति के सीधे आपस में जोड़ दिया जाए तो क्या समस्या हो सकती है?","options":["सेल के रासायनिक पदार्थ तेजी से खर्च हो सकते हैं","सेल का कार्य बंद हो सकता है","यह उचित विद्युत व्यवस्था नहीं है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"NCERT चेतावनी देता है कि सेल के दोनों Terminal से जुड़े तारों को बिना स्विच और बल्ब जैसी युक्ति के आपस में नहीं मिलाना चाहिए, क्योंकि इससे रासायनिक पदार्थ तेजी से खर्च हो सकते हैं।"},{"id":49,"q":"Q49. बल्ब के दोनों Terminal को सेल के दोनों Terminal से जोड़ने पर क्या बन सकता है?","options":["विद्युत-परिपथ","केवल विद्युत-रोधक","केवल स्विच","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"सेल और बल्ब के दोनों Terminal तारों द्वारा उचित रूप से जुड़ने पर एक पूर्ण विद्युत-परिपथ बन सकता है।"},{"id":50,"q":"Q50. बल्ब के जलने के लिए केवल सेल और बल्ब का होना पर्याप्त क्यों नहीं है?","options":["उनके बीच पूरा विद्युत-पथ भी आवश्यक है","बल्ब को पानी चाहिए","सेल को काँच में रखना आवश्यक है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"सेल विद्युत का स्रोत है, लेकिन धारा को निरंतर प्रवाहित होने के लिए पूरा परिपथ चाहिए। इसी कारण उचित तार-संबंध आवश्यक है।"},{"id":51,"q":"Q51. यदि तार का एक सिरा बल्ब के Terminal से जुड़ा है लेकिन दूसरा सिरा सेल से नहीं जुड़ा, तो बल्ब क्यों नहीं जलेगा?","options":["परिपथ पूरा नहीं है","बल्ब में तंतु नहीं होता","सेल अनिवार्य रूप से खराब है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"विद्युत-धारा को सेल से निकलकर पूरे परिपथ से होकर वापस दूसरे Terminal तक पहुँचने के लिए निरंतर पथ चाहिए। एक सिरा खुला रहने से यह पथ पूरा नहीं होता।"},{"id":52,"q":"Q52. विद्युत-परिपथ में धातु के तार की जगह प्लास्टिक का तार उपयोग करने पर क्या होगा?","options":["सामान्यतः धारा प्रवाहित नहीं होगी","प्लास्टिक चालक है","बल्ब अधिक चमकेगा","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"प्लास्टिक विद्युत-रोधक पदार्थ है। इसलिए यह धारा के प्रवाह के लिए धातु के तार का प्रभावी विकल्प नहीं है।"},{"id":53,"q":"Q53. चालक-परीक्षक में बल्ब नहीं जल रहा है। यदि सेल और बल्ब ठीक हैं, तो पदार्थ के बारे में क्या संभावना है?","options":["पदार्थ विद्युत-रोधक हो सकता है","पदार्थ निश्चित रूप से चालक है","पदार्थ हमेशा धातु है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"परीक्षण में यदि पदार्थ धारा को प्रवाहित नहीं करता, तो बल्ब दीप्त नहीं होता। ऐसी स्थिति में पदार्थ विद्युत-रोधक हो सकता है।"},{"id":54,"q":"Q54. बिजली के तारों पर प्लास्टिक का आवरण होने का क्या लाभ है?","options":["व्यक्ति को चालक धातु के सीधे संपर्क से बचाना","धारा को अनिवार्य रूप से समाप्त करना","तार को रोधक बनाना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"प्लास्टिक विद्युत-रोधक है। इसलिए तार के धातु वाले चालक भाग को ढककर सुरक्षा बढ़ाई जाती है।"},{"id":55,"q":"Q55. विद्युत-सेल में रासायनिक पदार्थों की भूमिका क्या है?","options":["उनसे विद्युत उत्पन्न होती है","वे बल्ब का काँच बनाते हैं","वे तार को चालक बनाते हैं","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"सेल के अंदर संचित रासायनिक पदार्थों से विद्युत उत्पन्न होती है। इनके उपयोग हो जाने पर सेल विद्युत उत्पादन बंद कर देता है।"},{"id":56,"q":"Q56. विद्युत-परिपथ में स्विच को तार के बीच रखने का उद्देश्य क्या है?","options":["परिपथ को जोड़ने या तोड़ने की सुविधा","सेल के रासायनिक पदार्थ बदलना","बल्ब का तंतु बदलना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"स्विच को परिपथ में इस प्रकार लगाया जाता है कि उसके द्वारा परिपथ को पूरा या खुला किया जा सके। इससे धारा का प्रवाह नियंत्रित होता है।"},{"id":57,"q":"Q57. किसी पदार्थ की चालकता जाँचने के लिए उसे चालक-परीक्षक के खुले सिरों के बीच क्यों लगाया जाता है?","options":["यह पता लगाने के लिए कि वह धारा को प्रवाहित करता है या नहीं","उसका रंग जानने के लिए","उसका तापमान बढ़ाने के लिए","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"पदार्थ को परिपथ के खुले भाग में लगाने से वह परिपथ का हिस्सा बनता है। यदि वह चालक है तो धारा प्रवाहित हो सकती है और बल्ब दीप्त हो सकता है।"},{"id":58,"q":"Q58. यदि किसी पदार्थ को लगाने पर बल्ब जलता है, तो क्या निष्कर्ष उचित है?","options":["पदार्थ विद्युत-चालक है","पदार्थ विद्युत-रोधक है","पदार्थ धारा को रोकता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"बल्ब के जलने का अर्थ है कि परीक्षण परिपथ में धारा का प्रवाह हुआ। इसलिए परीक्षण किया गया पदार्थ धारा को प्रवाहित करने वाला चालक है।"},{"id":59,"q":"Q59. यदि चालक-परीक्षक में हवा ही दो संपर्कों के बीच हो और बल्ब न जले, तो इससे क्या पता चलता है?","options":["हवा विद्युत-रोधक की तरह व्यवहार करती है","हवा अच्छा धात्विक चालक है","हवा बल्ब का तंतु है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"NCERT की गतिविधि में संपर्कों के बीच केवल हवा होने पर बल्ब नहीं जलता। इससे निष्कर्ष निकाला गया कि हवा भी विद्युत-रोधक है।"},{"id":60,"q":"Q60. विद्युत-स्विच का डिजाइन जटिल क्यों हो सकता है?","options":["घरेलू स्विच को सुविधाजनक और सुरक्षित उपयोग के लिए बनाया जाता है","उसे हमेशा खुला रखना होता है","उसमें कोई विद्युत संपर्क नहीं होता","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"NCERT बताता है कि घरों में उपयोग होने वाले स्विच सरल सिद्धांत पर काम करते हैं, लेकिन उनका डिजाइन अधिक जटिल हो सकता है ताकि उपयोग सुविधाजनक हो।"},{"id":61,"q":"Q61. यदि स्विच के दो धातु संपर्कों के बीच रबर रखा जाए, तो क्या होगा?","options":["संपर्क के बीच धारा आसानी से नहीं बहेगी","रबर चालक होने के कारण धारा बढ़ेगी","बल्ब अनिवार्य रूप से तेज जलेगा","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"रबर विद्युत-रोधक है। इसलिए वह संपर्कों के बीच धारा के प्रवाह को रोकता है और परिपथ को प्रभावी रूप से खुला रख सकता है।"},{"id":62,"q":"Q62. सेल का (+) Terminal सीधे बल्ब के एक Terminal से और बल्ब के दूसरे Terminal को सेल के (–) Terminal से जोड़ने का परिणाम क्या होगा?","options":["उचित परिपथ बनने पर बल्ब जल सकता है","बल्ब हमेशा नहीं जलेगा","सेल कोई विद्युत नहीं देता","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"यदि दोनों Terminal उचित तारों से जुड़े हैं और बल्ब का तंतु सही है, तो परिपथ पूरा होगा तथा धारा तंतु से होकर प्रवाहित होगी।"},{"id":63,"q":"Q63. विद्युत-परिपथ में धारा का प्रवाह किसके कारण बल्ब को दीप्त करता है?","options":["धारा का बल्ब के तंतु से होकर गुजरना","केवल बल्ब का काँच","केवल तार का रंग","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"जब परिपथ पूरा होता है तो विद्युत-धारा बल्ब के तंतु से होकर गुजरती है। इसी कारण तंतु दीप्त होता है।"},{"id":64,"q":"Q64. यदि बल्ब के दोनों Terminal एक ही सेल Terminal से जोड़ दिए जाएँ तो क्या सामान्य समस्या होगी?","options":["सेल के दोनों सिरों के बीच पूरा पथ नहीं बनेगा","बल्ब का तंतु निश्चित रूप से चमकेगा","दूसरा सेल स्वतः बन जाएगा","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"बल्ब को उचित रूप से दीप्त करने के लिए उसके दोनों Terminal को सेल के दोनों Terminal से जोड़ा जाना चाहिए ताकि पूरा परिपथ बन सके।"},{"id":65,"q":"Q65. यदि तार के दोनों खुले सिरों को आपस में स्पर्श करा दिया जाए तो चालक-परीक्षण में क्या सावधानी रखनी चाहिए?","options":["सेल के दोनों Terminal को सीधे आपस में नहीं मिलाना चाहिए","ऐसा करना हमेशा सुरक्षित है","इससे रासायनिक पदार्थ तेजी से खर्च हो सकते हैं","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"सेल के Terminal को बिना उचित युक्ति के सीधे जोड़ना उचित नहीं है। NCERT के अनुसार इससे सेल के रासायनिक पदार्थ तेजी से खर्च हो सकते हैं।"},{"id":66,"q":"Q66. विद्युत-परिपथ में धातु के तार की जगह ऊन की डोरी लगाने पर बल्ब क्यों नहीं जल सकता?","options":["ऊन विद्युत-धारा का उपयुक्त चालक नहीं है","ऊन धातु है","ऊन सेल बनाता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"NCERT में गतिविधि के माध्यम से अलग-अलग पदार्थों की चालकता जाँचने को कहा गया है। धारा प्रवाहित करने के लिए चालक पदार्थ आवश्यक है।"},{"id":67,"q":"Q67. किसी पदार्थ को चालक मानने का सबसे उपयुक्त आधार क्या है?","options":["वह विद्युत-धारा को अपने अंदर से प्रवाहित होने देता है","वह चमकीला दिखाई देता है","वह भारी होता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"पदार्थ की विद्युत-चालकता उसके अंदर विद्युत-धारा के प्रवाह से निर्धारित होती है, न कि उसके रंग, चमक या भार से।"},{"id":68,"q":"Q68. विद्युत-रोधक पदार्थों का विद्युत उपकरणों में उपयोग क्यों किया जाता है?","options":["सुरक्षा के लिए","धारा को हर जगह बढ़ाने के लिए","सेल बनाने के लिए","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"विद्युत-रोधक पदार्थ धारा को आसानी से प्रवाहित नहीं होने देते। इसलिए विद्युत उपकरणों के छूने योग्य भागों में रबर और प्लास्टिक जैसे पदार्थ सुरक्षा प्रदान करते हैं।"},{"id":69,"q":"Q69. किसी बल्ब को जलाने के लिए परिपथ में निम्न में से किनकी आवश्यकता हो सकती है?","options":["विद्युत-सेल","विद्युत-बल्ब","चालक तार","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"विद्युत-सेल स्रोत प्रदान करता है, तार विद्युत-पथ बनाते हैं और बल्ब धारा प्राप्त करके दीप्त होता है। उचित जोड़ से पूरा परिपथ बनता है।"},{"id":70,"q":"Q70. विद्युत-धारा के प्रवाह के लिए सबसे आवश्यक स्थिति क्या है?","options":["पूरा विद्युत-परिपथ","केवल बल्ब","केवल तार","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"धारा के निरंतर प्रवाह के लिए सेल के एक Terminal से दूसरे Terminal तक पूरा पथ होना चाहिए।\n\nSection C – Statement Based Questions\nप्रश्न 71–105"},{"id":71,"q":"Q71. निम्नलिखित कथनों पर विचार कीजिए:\n\nविद्युत-सेल विद्युत का स्रोत है।\nविद्युत-सेल में दो Terminal होते हैं।\nदोनों Terminal धनात्मक होते हैं।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"कथन 1 और 2 सही हैं। सेल विद्युत का स्रोत है और उसके एक धनात्मक तथा एक ऋणात्मक Terminal होते हैं। तीसरा कथन गलत है।"},{"id":72,"q":"Q72.\n\nबल्ब में तंतु होता है।\nतंतु विद्युत-धारा मिलने पर दीप्त हो सकता है।\nतंतु बल्ब के बाहर खुला रहता है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"बल्ब में पतला तंतु होता है और धारा प्रवाहित होने पर वह प्रकाश उत्पन्न करता है। तंतु बल्ब के काँच के अंदर होता है, इसलिए कथन 3 गलत है।"},{"id":73,"q":"Q73.\n\nविद्युत-परिपथ धारा का संपूर्ण पथ दर्शाता है।\nपूरा परिपथ होने पर धारा प्रवाहित हो सकती है।\nखुला परिपथ धारा के निरंतर प्रवाह के लिए पर्याप्त है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"पहले दो कथन अध्याय की परिभाषा और प्रयोग से सही हैं। खुला परिपथ धारा के निरंतर प्रवाह का पथ नहीं देता, इसलिए तीसरा गलत है।"},{"id":74,"q":"Q74.\n\nस्विच परिपथ को जोड़ सकता है।\nस्विच परिपथ को तोड़ सकता है।\nस्विच केवल बल्ब का रंग बदलता है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"स्विच का मूल कार्य परिपथ को जोड़ना या तोड़ना है। इसका बल्ब के रंग बदलने से कोई संबंध नहीं बताया गया है।"},{"id":75,"q":"Q75.\n\nताँबा विद्युत-चालक है।\nरबर विद्युत-रोधक है।\nप्लास्टिक सामान्यतः विद्युत-रोधक के रूप में उपयोग होता है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"तीनों कथन सही हैं। ताँबा धारा प्रवाहित करता है जबकि रबर और प्लास्टिक जैसे पदार्थ धारा को रोकने वाले पदार्थों के रूप में उपयोग किए जाते हैं।"},{"id":76,"q":"Q76.\n\nविद्युत-सेल में एक धनात्मक Terminal होता है।\nविद्युत-सेल में एक ऋणात्मक Terminal होता है।\nविद्युत-सेल में तीन Terminal होते हैं।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"सेल में कुल दो Terminal होते हैं—एक (+) और एक (–)। इसलिए तीसरा कथन गलत है।"},{"id":77,"q":"Q77.\n\nबल्ब का तंतु विद्युत-धारा से दीप्त हो सकता है।\nतंतु दो मोटे तारों से जुड़ा होता है।\nतंतु बल्ब के काँच के बाहर लगा होता है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"तंतु बल्ब के अंदर होता है और दो मोटे तारों से जुड़ा रहता है। धारा मिलने पर यह दीप्त होता है।"},{"id":78,"q":"Q78.\n\nबल्ब तभी दीप्त होता है जब परिपथ में धारा प्रवाहित हो।\nफ्यूज/टूटा तंतु परिपथ को तोड़ सकता है।\nपरिपथ टूटने पर भी धारा तंतु से होकर बहती रहती है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"धारा का प्रवाह बल्ब के दीप्त होने के लिए आवश्यक है। तंतु टूटने पर परिपथ टूट जाता है और तीसरा कथन गलत हो जाता है।"},{"id":79,"q":"Q79.\n\nचालक-परीक्षक से पदार्थ की चालकता जाँची जा सकती है।\nचालक पदार्थ के कारण परीक्षण परिपथ में धारा बह सकती है।\nहर पदार्थ विद्युत-चालक होता है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इ ा है।\nरबर विद्युत-रोधक है।\nधातु सामान्यतः चालक होती है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"NCERT की पदार्थ-परीक्षण गतिविधि में काँच और रबर जैसे पदार्थों को रोधक तथा धातुओं को चालक के रूप में समझाया गया है।"},{"id":90,"q":"Q90.\n\nचालक पदार्थ धारा प्रवाहित होने देते हैं।\nरोधक पदार्थ धारा के प्रवाह को रोकते हैं।\nचालक और रोधक का कोई व्यावहारिक महत्व नहीं है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"पहले दो कथन अध्याय की मूल अवधारणा हैं। चालक और रोधक दोनों विद्युत उपकरणों तथा सुरक्षा में महत्वपूर्ण हैं, इसलिए तीसरा गलत है।"},{"id":91,"q":"Q91.\n\nबिजली के सॉकेट से प्रयोग करना खतरनाक हो सकता है।\nबिजली के तारों से प्रयोग नहीं करना चाहिए।\nविद्युत से संबंधित गतिविधियों में साधारण बैटरी उपयोग करनी चाहिए।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"NCERT बिजली के तारों और सॉकेट से प्रयोग करने से मना करता है तथा विद्युत गतिविधियों के लिए साधारण बैटरी के उपयोग की सलाह देता है।"},{"id":92,"q":"Q92.\n\nसेल के दोनों Terminal पर तार जोड़े जा सकते हैं।\nउचित परिपथ में बल्ब को दोनों Terminal से जोड़ना होता है।\nतारों के खुले सिरों को बिना किसी युक्ति के सीधे मिला देना सुरक्षित है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"तारों को सेल के दोनों Terminal से जोड़ा जाता है, लेकिन उन्हें सीधे आपस में मिला देना उचित नहीं है क्योंकि सेल के रासायनिक पदार्थ तेजी से खर्च हो सकते हैं।"},{"id":93,"q":"Q93.\n\nचालक-परीक्षक में सेल का उपयोग किया जा सकता है।\nबल्ब परीक्षण का संकेत दे सकता है।\nपरीक्षण किए जाने वाले पदार्थ का परिपथ से कोई संबंध नहीं होता।","options":["केवल 1 और 2 सही हैं।","के है।\nइसलिए विद्युत उपकरणों का उपयोग सावधानी से करना चाहिए।\nमानव शरीर विद्युत-रोधक है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"NCERT में मानव शरीर को विद्युत का बहुत अच्छा चालक बताया गया है और इसी कारण विद्युत उपकरणों के उपयोग में सावधानी की चेतावनी दी गई है।"},{"id":99,"q":"Q99.\n\nविद्युत-सेल में धनात्मक और ऋणात्मक Terminal होते हैं।\nसेल के रासायनिक पदार्थ विद्युत उत्पादन में उपयोग होते हैं।\nसेल में केवल एक Terminal होता है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"सेल के दो Terminal होते हैं और उसके अंदर संचित रासायनिक पदार्थ विद्युत उत्पन्न करने में प्रयुक्त होते हैं। तीसरा कथन गलत है।"},{"id":100,"q":"Q100.\n\nविद्युत-रोधक धारा को रोकते हैं।\nविद्युत-चालक धारा को प्रवाहित होने देते हैं।\nरबर और प्लास्टिक का उपयोग सुरक्षा के लिए किया जा सकता है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"तीनों कथन सही हैं। चालक और रोधक के ये गुण विद्युत परिपथ बनाने तथा सुरक्षा के लिए महत्वपूर्ण हैं।"},{"id":101,"q":"Q101.\n\nपरिपथ के पूर्ण होने पर धारा प्रवाहित हो सकती है।\nबल्ब के तंतु से धारा गुजरने पर वह दीप्त हो सकता है।\nपरिपथ के टूटने पर धारा उसी प्रकार बहती रहती है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"पहला और दूसरा कथन परिपथ के कार्य सिद्धांत के अनुरूप हैं। परिपथ टूटने पर निरंतर धारा नहीं बहती, इसलिए तीसरा गलत है।"},{"id":102,"q":"Q102.\n\nतार के धातु वाले भाग चालक होते हैं।\nतारों पर प्लास्टिक आवरण सुरक्षा देता है।\nप्लास्टिक आवरण धातु की चालकता बढ़ाने के लिए लगाया जाता है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"तार का धातु वाला भाग धारा प्रवाहित करता है, जबकि प्लास्टिक आवरण रोधक होने के कारण सुरक्षा देता है। यह चालकता बढ़ाने के लिए नहीं लगाया जाता।"},{"id":103,"q":"Q103.\n\nस्विच OFF स्थिति में परिपथ पूरा नहीं होता।\nON स्थिति में संपर्क जुड़ सकते हैं।\nदोनों स्थितियों में परिपथ समान रहता है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"ON और OFF स्थितियों में स्विच के संपर्कों की स्थिति अलग होती है। इसी कारण परिपथ के जुड़ने या टूटने में अंतर आता है।"},{"id":104,"q":"Q104.\n\nचालक-परीक्षक में बल्ब का जलना चालकता का संकेत हो सकता है।\nबल्ब का न जलना रोधक पदार्थ की ओर संकेत कर सकता है।\nपरीक्षण में पदार्थ को परिपथ से अलग रखना आवश्यक है।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"परीक्षण पदार्थ को परिपथ के खुले भाग में जोड़ना होता है। उसके चालक होने पर धारा बह सकती है और बल्ब दीप्त हो सकता है।"},{"id":105,"q":"Q105.\n\nविद्युत-परिपथ में सेल विद्युत स्रोत है।\nस्विच धारा के प्रवाह को नियंत्रित करने में सहायता करता है।\nरोधक पदार्थ धारा को आसानी से प्रवाहित करते हैं।","options":["केवल 1 और 2 सही हैं।","केवल 1 और 3 सही हैं।","केवल 2 और 3 सही हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"सेल स्रोत है और स्विच परिपथ को जोड़कर या तोड़कर धारा के प्रवाह को नियंत्रित करता है। रोधक धारा के प्रवाह को रोकते हैं, इसलिए तीसरा कथन गलत है।\n\nSection D – Assertion–Reason\nप्रश्न 106–125"},{"id":106,"q":"Q106.\nकथन (A): विद्युत-सेल विद्युत का स्रोत है।\nकारण (R): सेल में संचित रासायनिक पदार्थों से विद्युत उत्पन्न होती है।","options":["कथन (A) और कारण (R) दोनों सही हैं तथा कारण (R), कथन (A) की सही व्याख्या करता है।","कथन (A) और कारण (R) दोनों सही हैं, लेकिन कारण (R), कथन (A) की सही व्याख्या नहीं करता है।","कथन (A) सही है, लेकिन कार R), कथन (A) की सही व्याख्या करता है।","कथन (A) और कारण (R) दोनों सही हैं, लेकिन कारण (R), कथन (A) की सही व्याख्या नहीं करता है।","कथन (A) सही है, लेकिन कारण (R) गलत है।","कथन (A) गलत है, लेकिन कारण (R) सही है।","कथन (A) और कारण (R) दोनों गलत हैं।"],"answer":2,"explanation":"कथन सही है क्योंकि थर्मोकोल विद्युत-रोधक है। कारण गलत है, क्योंकि रोधक धारा को आसानी से प्रवाहित नहीं होने देता।"},{"id":121,"q":"Q121.\nकथन (A): विद्युत-सेल में दो Terminal होते हैं।\nकारण (R): एक Terminal धनात्मक और दूसरा ऋणात्मक होता है।","options":["कथन (A) और कारण (R) दोनों सही हैं तथा कारण (R), कथन (A) की सही व्याख्या करता है।","कथन (A) और कारण (R) दोनों सही हैं, लेकिन कारण (R), कथन (A) की सही व्याख्या नहीं करता है।","कथन (A) सही है, लेकिन कारण (R) गलत है।","कथन (A) गलत है, लेकिन कारण (R) सही है।","कथन (A) और कारण (R) दोनों गलत हैं।"],"answer":1,"explanation":"दोनों कथन सही हैं, लेकिन दूसरा कथन मुख्यतः दोनों Terminal की प्रकृति बताता है; वह सीधे इस बात की व्याख्या नहीं करता कि संख्या दो ही क्यों है।"},{"id":122,"q":"Q122.\nकथन (A): विद्युत-बल्ब को दीप्त करने के लिए परिपथ का पूरा होना आवश्यक है।\nकारण (R): पूरा परिपथ विद्युत-धारा के प्रवाह के लिए निरंतर पथ प्रदान करता है।","options":["कथन (A) और कारण (R) दोनों सही हैं तथा कारण (R), कथन (A) की सही व्याख्या करता है।","कथन (A) और कारण (R) दोनों सही हैं, लेकिन कारण (R), कथन (A) की सही व्याख्या नहीं करता है।","कथन (A) सही है, लेकिन कारण (R) गलत है।","कथन (A) गलत है, लेकिन कारण (R) सही है।","कथन (A) और कारण (R) दोनों गलत हैं।"],"answer":0,"explanation":"धारा का प्रवाह निरंतर पथ के बिना नहीं हो सकता। इसलिए पूरा परिपथ बल्ब के दीप्त होने की आवश्यक शर्त है।"},{"id":123,"q":"Q123.\nकथन (A): रबर के दस्ताने विद्युत कार्य में सुरक्षा दे सकते हैं।\nकारण (R): रबर विद्युत-धारा को आसानी से प्रवाहित नहीं होने देता।","options":["कथन (A) और कारण (R) दोनों सही हैं तथा कारण (R), कथन (A) की सही व्याख्या करता है।","कथन (A) और कारण (R) दोनों सही हैं, लेकिन कारण (R), कथन (A) की सही व्याख्या नहीं करता है।","कथन (A) सही है, लेकिन कारण (R) गलत है।","कथन (A) गलत है, लेकिन कारण (R) सही है।","कथन (A) और कारण (R) दोनों गलत हैं।"],"answer":0,"explanation":"रबर रोधक है। इसलिए यह शरीर और विद्युत-चालक भाग के बीच सुरक्षा प्रदान करने में उपयोगी हो सकता है।"},{"id":124,"q":"Q124.\nकथन (A): सेल के रासायनिक पदार्थ समाप्त होने पर सेल विद्युत उत्पन्न करना बंद कर देता है।\nकारण (R): सेल की विद्युत उत्पत्ति संचित रासायनिक पदार्थों पर निर्भर करती है।","options":["कथन (A) और कारण (R) दोनों सही हैं तथा कारण (R), कथन (A) की सही व्याख्या करता है।","कथन (A) और कारण (R) दोनों सही हैं, लेकिन कारण (R), कथन (A) की सही व्याख्या नहीं करता है।","कथन (A) सही है, लेकिन कारण (R) गलत है।","कथन (A) गलत है, लेकिन कारण (R) सही है।","कथन (A) और कारण (R) दोनों गलत हैं।"],"answer":0,"explanation":"NCERT के अनुसार सेल में संचित रासायनिक पदार्थ उपयोग होने के बाद सेल विद्युत उत्पन्न करना बंद कर देता है।"},{"id":125,"q":"Q125.\nकथन (A): बिजली के सॉकेट से प्रयोग करना सुरक्षित है।\nकारण (R): सॉकेट से प्राप्त विद्युत भी साधारण बैटरी जितनी ही सुरक्षित है।","options":["कथन (A) और कारण (R) दोनों सही हैं तथा कारण (R), कथन (A) की सही व्याख्या करता है।","कथन (A) और कारण (R) दोनों सही हैं, लेकिन कारण (R), कथन (A) की सही व्याख्या नहीं करता है।","कथन (A) सही है, लेकिन कारण (R) गलत है।","कथन (A) गलत है, लेकिन कारण (R) सही है।","कथन (A) और कारण (R) दोनों गलत हैं।"],"answer":4,"explanation":"दोनों कथन गलत हैं। NCERT बिजली के तारों और सॉकेट से प्रयोग करने से मना करता है तथा गतिविधियों के लिए साधारण बैटरी के उपयोग की सलाह देता है।\n\nSection E – Case / Scenario Based Questions\nप्रश्न 126–150\n\nCase 1: राहुल ने एक सेल, बल्ब और दो तार लिए। उसने दोनों तारों द्वारा बल्ब को सेल से जोड़ने का प्रयास किया।"},{"id":126,"q":"Case 1: राहुल ने एक सेल, बल्ब और दो तार लिए। उसने दोनों तारों द्वारा बल्ब को सेल से जोड़ने का प्रयास किया।\n\nQ126. राहुल द्वारा बनाई गई व्यवस्था का उद्देश्य क्या है?","options":["बल्ब को दीप्त करना","सेल को सजाना","तार को गर्म करना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"सेल विद्युत का स्रोत है और उचित तार-संबंध से बल्ब के तंतु में धारा पहुँचाई जा सकती है। इस व्यवस्था का उद्देश्य बल्ब को जलाना है।"},{"id":127,"q":"Case 1: राहुल ने एक सेल, बल्ब और दो तार लिए। उसने दोनों तारों द्वारा बल्ब को सेल से जोड़ने का प्रयास किया।\n\nQ127. राहुल का बल्ब तभी जलेगा जब—","options":["परिपथ पूरा हो","परिपथ खुला हो","एक तार हवा में खुला हो","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"पूर्ण परिपथ ही सेल से बल्ब और वापस सेल तक धारा के लिए निरंतर पथ देता है।"},{"id":128,"q":"Case 1: राहुल ने एक सेल, बल्ब और दो तार लिए। उसने दोनों तारों द्वारा बल्ब को सेल से जोड़ने का प्रयास किया।\n\nQ128. राहुल ने एक तार की जगह रबर की पट्टी लगा दी। बल्ब नहीं जला। इसका सबसे उचित कारण क्या है?","options":["रबर विद्युत-रोधक है","रबर धातु है","रबर सेल का स्रोत है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"रबर विद्युत-धारा को प्रवाहित नहीं होने देता, इसलिए धातु के चालक तार के स्थान पर रबर लगाने से परिपथ में आवश्यक धारा नहीं बहती।"},{"id":129,"q":"Case 1: राहुल ने एक सेल, बल्ब और दो तार लिए। उसने दोनों तारों द्वारा बल्ब को सेल से जोड़ने का प्रयास किया।\n\nQ129. यदि राहुल स्विच को परिपथ में लगाकर ON करता है, तो क्या होगा?","options":["परिपथ पूरा हो सकता है","धारा प्रवाहित हो सकती है","बल्ब जल सकता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"ON स्थिति में स्विच संपर्क स्थापित करता है। यदि बाकी परिपथ सही है तो पूरा पथ बनता है, धारा बहती है और बल्ब दीप्त हो सकता है।\n\nCase 2: सीमा ने चालक-परीक्षक बनाया और विभिन्न पदार्थों को तारों के स्वतंत्र सिरों के बीच लगाया।"},{"id":130,"q":"Case 2: सीमा ने चालक-परीक्षक बनाया और विभिन्न पदार्थों को तारों के स्वतंत्र सिरों के बीच लगाया।\n\nQ130. चालक-परीक्षक का मुख्य उद्देश्य क्या है?","options":["पदार्थ चालक है या रोधक, यह जाँचना","पदार्थ का रंग देखना","पदार्थ का आकार बदलना","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"चालक-परीक्षक में पदार्थ को परिपथ का हिस्सा बनाकर यह देखा जाता है कि वह विद्युत-धारा को प्रवाहित होने देता है या नहीं।"},{"id":131,"q":"Case 2: सीमा ने चालक-परीक्षक बनाया और विभिन्न पदार्थों को तारों के स्वतंत्र सिरों के बीच लगाया।\n\nQ131. सीमा ने लोहे की कील लगाई और बल्ब जल गया। इससे क्या निष्कर्ष निकलेगा?","options":["लोहा विद्युत-चालक है","लोहा विद्युत-रोधक है","कील धारा को रोकती है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"बल्ब का जलना बताता है कि परीक्षण परिपथ में धारा प्रवाहित हुई। इसलिए लोहे की कील चालक पदार्थ है।"},{"id":132,"q":"Case 2: सीमा ने चालक-परीक्षक बनाया और विभिन्न पदार्थों को तारों के स्वतंत्र सिरों के बीच लगाया।\n\nQ132. सीमा ने प्लास्टिक का टुकड़ा लगाया और बल्ब नहीं जला। इससे क्या संकेत मिलता है?","options":["प्लास्टिक विद्युत-रोधक है","प्लास्टिक अच्छा चालक है","प्लास्टिक धारा उत्पन्न करता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"प्लास्टिक धारा के प्रवाह को रोकता है। इसलिए परीक्षण में बल्ब का न जलना उसके रोधक होने का संकेत है।"},{"id":133,"q":"Case 2: सीमा ने चालक-परीक्षक बनाया और विभिन्न पदार्थों को तारों के स्वतंत्र सिरों के बीच लगाया।\n\nQ133. सीमा ने काँच की चूड़ी परीक्षण में लगाई और बल्ब नहीं जला। उचित निष्कर्ष क्या होगा?","options":["काँच विद्युत-रोधक है","काँच अच्छा चालक है","काँच सेल है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"परीक्षण में काँच के कारण धारा का पथ पूरा नहीं हुआ और बल्ब दीप्त नहीं हुआ। इससे काँच के रोधक व्यवहार का पता चलता है।\n\nCase 3: मोहन ने स्विच बनाने के लिए दो ड्रॉइंग पिन और एक सुरक्षा पिन का उपयोग किया।"},{"id":134,"q":"Case 3: मोहन ने स्विच बनाने के लिए दो ड्रॉइंग पिन और एक सुरक्षा पिन का उपयोग किया।\n\nQ134. सुरक्षा पिन दोनों ड्रॉइंग पिनों को स्पर्श करती है। स्विच की कौन-सी अवस्था होगी?","options":["ON","OFF","दोनों","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"सुरक्षा पिन दोनों संपर्कों को जोड़कर बीच के रिक्त स्थान को भर देती है। इससे परिपथ पूरा होता है और स्विच ON माना जाता है।"},{"id":135,"q":"Case 3: मोहन ने स्विच बनाने के लिए दो ड्रॉइंग पिन और एक सुरक्षा पिन का उपयोग किया।\n\nQ135. यदि सुरक्षा पिन दूसरे ड्रॉइंग पिन को स्पर्श न करे, तो क्या होगा?","options":["परिपथ पूरा नहीं होगा","बल्ब नहीं जलेगा","स्विच OFF होगा","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"दोनों संपर्कों के बीच रिक्त स्थान खुला रहने पर परिपथ पूरा नहीं होता। इसलिए धारा नहीं बहती और स्विच OFF स्थिति में होता है।"},{"id":136,"q":"Case 3: मोहन ने स्विच बनाने के लिए दो ड्रॉइंग पिन और एक सुरक्षा पिन का उपयोग किया।\n\nQ136. मोहन सुरक्षा पिन की जगह रबर की पट्टी लगाता है। क्या अपेक्षित है?","options":["परिपथ में धारा प्रवाहित नहीं होगी","बल्ब नहीं जलेगा","रबर रोधक होने के कारण संपर्क नहीं बनाएगा","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"रबर विद्युत-रोधक है। इसलिए वह दोनों संपर्कों के बीच विद्युत-धारा के प्रवाह के लिए उपयुक्त चालक संपर्क नहीं बना सकता।\n\nCase 4: नेहा को टॉर्च के बल्ब के अंदर का भाग देखने का अवसर मिला।"},{"id":137,"q":"Case 4: नेहा को टॉर्च के बल्ब के अंदर का भाग देखने का अवसर मिला।\n\nQ137. बल्ब के अंदर दिखाई देने वाला पतला तार क्या कहलाता है?","options":["तंतु","Terminal","स्विच","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"बल्ब का प्रकाश उत्पन्न करने वाला पतला तार तंतु (Filament) कहलाता है।"},{"id":138,"q":"Case 4: नेहा को टॉर्च के बल्ब के अंदर का भाग देखने का अवसर मिला।\n\nQ138. तंतु किससे जुड़ा होता है?","options":["दो मोटे तारों से","केवल काँच से","केवल प्लास्टिक से","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"तंतु दो मोटे तारों के बीच लगा होता है। ये मोटे तार तंतु को आधार प्रदान करते हैं और उसे बाहरी परिपथ से जोड़ने में सहायता करते हैं।"},{"id":139,"q":"Case 4: नेहा को टॉर्च के बल्ब के अंदर का भाग देखने का अवसर मिला।\n\nQ139. बल्ब का आधार और धातु की नोक क्या दर्शाते हैं?","options":["बल्ब के दो Terminal","बल्ब के दो तंतु","दो सेल","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"बल्ब के आधार पर धातु का ढाँचा और धातु की नोक उसके दो Terminal होते हैं।\n\nCase 5: अमन ने सेल और बल्ब को अलग-अलग छह प्रकार से जोड़कर यह देखा कि कुछ व्यवस्थाओं में बल्ब जलता है और कुछ में नहीं।"},{"id":140,"q":"Case 5: अमन ने सेल और बल्ब को अलग-अलग छह प्रकार से जोड़कर यह देखा कि कुछ व्यवस्थाओं में बल्ब जलता है और कुछ में नहीं।\n\nQ140. जिन व्यवस्थाओं में बल्ब जलता है, उनमें क्या सामान्य बात होगी?","options":["परिपथ पूरा होगा","धारा का प्रवाह होगा","बल्ब के तंतु से धारा गुजर सकती है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"बल्ब के दीप्त होने के लिए पूरा परिपथ और धारा का प्रवाह आवश्यक है। धारा तंतु से होकर गुजरने पर बल्ब प्रकाश देता है।"},{"id":141,"q":"Case 5: अमन ने सेल और बल्ब को अलग-अलग छह प्रकार से जोड़कर यह देखा कि कुछ व्यवस्थाओं में बल्ब जलता है और कुछ में नहीं।\n\nQ141. जिन व्यवस्थाओं में सेल के एक Terminal से दूसरे Terminal तक पहुँचने के लिए पेंसिल को ऊपर उठाना पड़े, उनमें बल्ब क्यों नहीं जलेगा?","options":["पथ में रिक्त स्थान है","परिपथ पूरा नहीं है","धारा का निरंतर प्रवाह नहीं हो सकता","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"यदि पथ में कहीं संपर्क टूट जाता है तो सेल से दूसरे Terminal तक निरंतर विद्युत-पथ नहीं बनता। इसलिए धारा नहीं बहती और बल्ब नहीं जलता।"},{"id":142,"q":"Case 5: अमन ने सेल और बल्ब को अलग-अलग छह प्रकार से जोड़कर यह देखा कि कुछ व्यवस्थाओं में बल्ब जलता है और कुछ में नहीं।\n\nQ142. यदि बल्ब और सेल के दोनों Terminal उचित रूप से जुड़े हों, तो क्या संभव है?","options":["पूर्ण परिपथ बन सकता है","धारा प्रवाहित हो सकती है","बल्ब जल सकता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"दोनों Terminal का उचित संबंध विद्युत-परिपथ का निर्माण करता है। यदि बल्ब का तंतु सही है तो धारा प्रवाहित होकर उसे दीप्त कर सकती है।\n\nCase 6: पूजा ने अलग-अलग पदार्थों—सिक्का, रबर, काँच, चाबी, प्लास्टिक, लकड़ी, एल्युमिनियम की पत्ती और पेंसिल की लीड—का परीक्षण किया।"},{"id":143,"q":"Case 6: पूजा ने अलग-अलग पदार्थों—सिक्का, रबर, काँच, चाबी, प्लास्टिक, लकड़ी, एल्युमिनियम की पत्ती और पेंसिल की लीड—का परीक्षण किया।\n\nQ143. इनमें से किस प्रकार के पदार्थ बल्ब को दीप्त करने में सहायता कर सकते हैं?","options":["विद्युत-चालक पदार्थ","विद्युत-रोधक पदार्थ","केवल प्लास्टिक","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"जो पदार्थ विद्युत-धारा को प्रवाहित होने देते हैं, वे चालक हैं और परीक्षण परिपथ को पूरा करके बल्ब को दीप्त कर सकते हैं।"},{"id":144,"q":"Case 6: पूजा ने अलग-अलग पदार्थों—सिक्का, रबर, काँच, चाबी, प्लास्टिक, लकड़ी, एल्युमिनियम की पत्ती और पेंसिल की लीड—का परीक्षण किया।\n\nQ144. रबर के कारण बल्ब नहीं जलने पर क्या निष्कर्ष निकलेगा?","options":["रबर विद्युत-रोधक है","रबर चालक है","रबर धारा को आसानी से प्रवाहित करता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"रबर धारा के प्रवाह को रोकता है। इसलिए चालक-परीक्षण में रबर से बल्ब का न जलना उसके रोधक गुण को दर्शाता है।"},{"id":145,"q":"Case 6: पूजा ने अलग-अलग पदार्थों—सिक्का, रबर, काँच, चाबी, प्लास्टिक, लकड़ी, एल्युमिनियम की पत्ती और पेंसिल की लीड—का परीक्षण किया।\n\nQ145. यदि एल्युमिनियम की पत्ती से बल्ब जलता है, तो उसका क्या अर्थ है?","options":["एल्युमिनियम विद्युत-चालक है","एल्युमिनियम विद्युत-रोधक है","एल्युमिनियम धारा को रोकता है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"बल्ब के जलने का अर्थ है कि परीक्षण पदार्थ के माध्यम से परिपथ में धारा प्रवाहित हुई। अतः एल्युमिनियम चालक है।\n\nCase 7: राजू ने विद्युत से संबंधित प्रयोग करने के लिए घर के सॉकेट से बिजली लेने का विचार किया।"},{"id":146,"q":"Case 7: राजू ने विद्युत से संबंधित प्रयोग करने के लिए घर के सॉकेट से बिजली लेने का विचार किया।\n\nQ146. राजू को ऐसा प्रयोग करना चाहिए?","options":["नहीं","हाँ, बिना किसी सावधानी के","केवल गीले हाथों से","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"NCERT बिजली के तारों और सॉकेट आदि से प्रयोग करने से स्पष्ट रूप से मना करता है। ऐसी विद्युत गंभीर चोट या मृत्यु का कारण बन सकती है।"},{"id":147,"q":"Case 7: राजू ने विद्युत से संबंधित प्रयोग करने के लिए घर के सॉकेट से बिजली लेने का विचार किया।\n\nQ147. राजू को विद्यालयी गतिविधि के लिए किसका उपयोग करना चाहिए?","options":["साधारण बैटरी","घरेलू सॉकेट","खुले बिजली के तार","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"NCERT विद्युत से संबंधित गतिविधियों के लिए साधारण बैटरी के उपयोग की सलाह देता है।\n\nCase 8: सीमा ने बिजली-मिस्त्री को रबर के दस्ताने और प्लास्टिक से ढके औजारों के साथ काम करते देखा।"},{"id":148,"q":"Case 8: सीमा ने बिजली-मिस्त्री को रबर के दस्ताने और प्लास्टिक से ढके औजारों के साथ काम करते देखा।\n\nQ148. औजारों के हैंडल पर प्लास्टिक या रबर क्यों लगाया जाता है?","options":["सुरक्षा के लिए","क्योंकि ये विद्युत-रोधक हैं","ताकि व्यक्ति चालक भाग से सीधे संपर्क में न आए","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"रबर और प्लास्टिक विद्युत-रोधक हैं। इनके आवरण विद्युत-चालक भाग को सीधे छूने से बचाकर सुरक्षा बढ़ाते हैं।"},{"id":149,"q":"Case 8: सीमा ने बिजली-मिस्त्री को रबर के दस्ताने और प्लास्टिक से ढके औजारों के साथ काम करते देखा।\n\nQ149. यदि बिजली-मिस्त्री के औजार का धातु वाला भाग सीधे हाथ से छुआ जाए तो जोखिम क्यों है?","options":["मानव शरीर अच्छा विद्युत-चालक है","विद्युत शरीर से प्रवाहित हो सकती है","गंभीर चोट हो सकती है","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"मानव शरीर विद्युत का अच्छा चालक है। इसलिए विद्युत-चालक भाग के संपर्क में आने पर विद्युत शरीर से गुजर सकती है और गंभीर दुर्घटना हो सकती है।\n\nCase 9: एक विद्यार्थी ने देखा कि उसके टॉर्च का बल्ब सेल बदलने के बाद भी नहीं जल रहा था।"},{"id":150,"q":"Case 9: एक विद्यार्थी ने देखा कि उसके टॉर्च का बल्ब सेल बदलने के बाद भी नहीं जल रहा था।\n\nQ150. सबसे पहले किन बातों की जाँच करना उचित होगा?","options":["परिपथ पूरा है या नहीं","बल्ब का तंतु टूटा तो नहीं है","सेल और बल्ब के Terminal उचित रूप से जुड़े हैं या नहीं","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":""}]
const sections=[{"name":"Section A — Basic / Direct NCERT Questions","start":1,"end":35},{"name":"Section B — Concept Based Questions","start":36,"end":70},{"name":"Section C — Statement Based Questions","start":71,"end":105},{"name":"Section D — Assertion–Reason Questions","start":106,"end":125},{"name":"Section E — Case / Scenario Based Questions","start":126,"end":150}];

let selectedSection=null;
let quiz=[];
let currentIndex=0;
let answers={};
let checked={};
let reviewMode=false;

function goHome(){
 document.getElementById("home").classList.remove("hidden");
 document.getElementById("setup").classList.add("hidden");
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 selectedSection=null;quiz=[];currentIndex=0;answers={};checked={};reviewMode=false;
 window.scrollTo(0,0);
}

function renderSections(){
 const box=document.getElementById("sectionsList");
 box.innerHTML="";
 sections.forEach((s,i)=>{
  const d=document.createElement("div");
  d.className="section";
  d.innerHTML=`<div class="section-title">${s.name}</div><div class="section-count">${s.end-s.start+1} Questions</div>`;
  d.onclick=()=>startSection(i);
  box.appendChild(d);
 });
}

function startSection(i){
 selectedSection=sections[i];
 const list=questions.slice(selectedSection.start-1,selectedSection.end);
 document.getElementById("home").classList.add("hidden");
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("setup").classList.remove("hidden");

 document.getElementById("setupTitle").textContent=selectedSection.name;
 document.getElementById("setupInfo").textContent=`${list.length} MCQs available`;

 const sel=document.getElementById("questionCount");
 sel.innerHTML="";
 [5,10,20,list.length].forEach(n=>{
  if(n<=list.length && !Array.from(sel.options).some(o=>Number(o.value)===n)){
   const o=document.createElement("option");
   o.value=n;
   o.textContent=n===list.length?`All ${n} Questions`:`${n} Questions`;
   sel.appendChild(o);
  }
 });
 // IMPORTANT: default हमेशा पूरे section की question count रहेगी
 sel.value=String(list.length);
 window.scrollTo(0,0);
}

function startPractice(){
 const list=questions.slice(selectedSection.start-1,selectedSection.end)
   .map((q,i)=>({...q,_id:selectedSection.start+i}));
 const count=Number(document.getElementById("questionCount").value);

 quiz=list.slice(0,count);
 currentIndex=0;
 answers={};
 checked={};
 reviewMode=false;

 document.getElementById("setup").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 render();
 window.scrollTo(0,0);
}

function render(){
 const q=quiz[currentIndex];
 if(!q)return;

 document.getElementById("sectionName").textContent=selectedSection.name;
 document.getElementById("counter").textContent=`Question ${currentIndex+1} of ${quiz.length}`;
 document.getElementById("attempted").textContent=`Attempted: ${Object.keys(answers).length}/${quiz.length}`;
 document.getElementById("question").textContent=`Q${q._id}. ${q.q}`;

 const box=document.getElementById("options");
 box.innerHTML="";
 document.getElementById("feedback").textContent="";
 document.getElementById("explanation").classList.add("hidden");
 document.getElementById("explanation").innerHTML="";

 q.options.forEach((opt,i)=>{
  const b=document.createElement("button");
  b.type="button";
  b.className="option";
  b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${opt}`;

  const selected=answers[q._id];
  if(selected===i)b.classList.add("selected");

  if(checked[q._id] || reviewMode){
   b.disabled=true;
   if(i===q.answer)b.classList.add("correct");
   if(selected===i && i!==q.answer)b.classList.add("wrong");
  }else{
   b.onclick=()=>{
    answers[q._id]=i;
    render();
   };
  }
  box.appendChild(b);
 });

 if(checked[q._id] || reviewMode){
  const f=document.getElementById("feedback");
  if(selectedAnswerExists(q)){
   f.textContent=answers[q._id]===q.answer
     ?"✅ सही उत्तर!"
     :`❌ गलत। सही उत्तर: ${String.fromCharCode(65+q.answer)}`;
   f.style.color=answers[q._id]===q.answer?"#15803d":"#b91c1c";
  }else{
   f.textContent=`⚪ Unattempted. सही उत्तर: ${String.fromCharCode(65+q.answer)}`;
   f.style.color="#536579";
  }

  document.getElementById("explanation").innerHTML=
    `<div class="explanation-title">💡 Explanation</div>${formatExplanation(q.explanation)}`;
  document.getElementById("explanation").classList.remove("hidden");
 }

 renderPalette();
 document.getElementById("prevBtn").disabled=currentIndex===0;
 document.getElementById("nextBtn").disabled=currentIndex===quiz.length-1;
 document.getElementById("checkBtn").disabled=reviewMode || !!checked[q._id] || answers[q._id]===undefined;
 document.getElementById("submitBtn").style.display=reviewMode?"none":"inline-block";
}

function selectedAnswerExists(q){
 return answers[q._id]!==undefined;
}

function formatExplanation(s){
 return s.replace(/\n/g,"<br>");
}

function renderPalette(){
 const p=document.getElementById("palette");
 p.innerHTML="<h3>Question Palette</h3>";
 const g=document.createElement("div");
 g.className="pal-grid";

 quiz.forEach((q,i)=>{
  const b=document.createElement("button");
  b.className="pal";
  b.type="button";
  b.textContent=q._id;
  if(i===currentIndex)b.classList.add("active");
  if(answers[q._id]!==undefined)b.classList.add("done");
  b.onclick=()=>{
   currentIndex=i;
   render();
   window.scrollTo(0,0);
  };
  g.appendChild(b);
 });
 p.appendChild(g);
}

document.getElementById("prevBtn").onclick=()=>{
 if(currentIndex>0){
  currentIndex--;
  render();
  window.scrollTo(0,0);
 }
};

document.getElementById("nextBtn").onclick=()=>{
 if(currentIndex<quiz.length-1){
  currentIndex++;
  render();
  window.scrollTo(0,0);
 }
};

document.getElementById("checkBtn").onclick=()=>{
 const q=quiz[currentIndex];
 if(answers[q._id]===undefined)return;
 checked[q._id]=true;
 render();
};

document.getElementById("submitBtn").onclick=()=>{
 if(confirm("क्या आप अपना test submit करना चाहते हैं?"))showResult();
};

function showResult(){
 let correct=0,attempted=Object.keys(answers).length;
 quiz.forEach(q=>{
  if(answers[q._id]===q.answer)correct++;
 });
 let wrong=Object.keys(answers).filter(id=>{
  const q=quiz.find(x=>String(x._id)===String(id));
  return q && answers[id]!==q.answer;
 }).length;

 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 document.getElementById("resultText").innerHTML=
 `<div><b>Score:</b> ${correct} / ${quiz.length}</div>
  <div>🟢 Correct: ${correct}</div>
  <div>🔴 Wrong: ${wrong}</div>
  <div>⚪ Unattempted: ${quiz.length-attempted}</div>
  <div>📊 Attempted: ${attempted}</div>`;

 window.scrollTo(0,0);
}

document.getElementById("reviewBtn").onclick=()=>{
 reviewMode=true;
 currentIndex=0;
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 render();
 window.scrollTo(0,0);
};

// Keyboard shortcuts: N = Next, P = Previous
document.addEventListener("keydown", (e)=>{
  const tag = document.activeElement?.tagName;
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

  const key = e.key.toLowerCase();

  if(key === "n" && currentIndex < quiz.length - 1){
    e.preventDefault();
    currentIndex++;
    render();
    window.scrollTo(0,0);
  }

  if(key === "p" && currentIndex > 0){
    e.preventDefault();
    currentIndex--;
    render();
    window.scrollTo(0,0);
  }
});

document.getElementById("homeBtn").onclick=goHome;

renderSections();
</script>
</body>
</html>
