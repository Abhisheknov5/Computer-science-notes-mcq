<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>गति एवं दूरियों का मापन | MCQ Practice</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f5f7;color:#172b4d;line-height:1.6}
.container{max-width:1100px;margin:auto;padding:24px 20px}
.card{background:#fff;border-radius:18px;box-shadow:0 5px 18px rgba(0,0,0,.08)}
.hidden{display:none!important}
h1,h2,h3{margin-top:0}
button,select{font:inherit}
button{border:0;border-radius:9px;padding:11px 18px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.home{padding:28px}
.home h1{font-size:32px;margin-bottom:6px}
.sub{color:#536579;font-size:18px}
.section{border:1px solid #d4dae2;border-radius:12px;padding:17px 20px;margin:12px 0;cursor:pointer;background:#fafbfc}
.section:hover{background:#f5f8fc}
.section-title{font-size:20px;font-weight:700;color:#111}
.section-count{color:#536579}
.setup{padding:28px}
.question-select-row{display:flex;align-items:center;gap:10px;flex-wrap:nowrap}
.question-select-row label{font-size:18px;white-space:nowrap}
.back{display:inline-block;color:#2563eb;text-decoration:none;font-weight:700;margin-bottom:18px}
select{padding:10px 14px;border:1px solid #ccc;border-radius:8px;margin-left:8px}
.next{background:#16a34a;color:#fff}
.prev{background:#6b7280;color:#fff}
.submit{background:#2563eb;color:#fff}
.quiz-topbar{margin:0 0 14px}
.topics-back{padding:12px 18px;border:1px solid #d1d5db;border-radius:10px;background:#f5f5f5;color:#111827;font-size:16px;cursor:pointer}
.topics-back:hover{background:#e5e7eb}
.quiz-header{padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}
.quiz-header strong{font-size:18px}
.question-card{padding:26px;margin-bottom:18px}
.question{font-size:22px;font-weight:700;margin-bottom:20px;white-space:pre-line}
.option{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px;border:2px solid #e1e5ea;background:#fff;border-radius:10px}
.option:hover{border-color:#2563eb;background:#eff6ff}
.option.selected{border-color:#2563eb;background:#dbeafe}
.option.correct{border-color:#16a34a;background:#dcfce7}
.option.wrong{border-color:#dc2626;background:#fee2e2}
.feedback{min-height:28px;font-weight:700;margin-top:12px}
.explanation{margin-top:14px;padding:16px 18px;border-left:5px solid #2563eb;border-radius:10px;background:#eff6ff;color:#172b4d;font-size:16px;line-height:1.65}
.explanation-title{font-weight:700;font-size:18px;margin-bottom:6px}
.bottom{padding:18px 24px;display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}
.palette{padding:20px 24px}
.pal-grid{display:flex;flex-wrap:wrap;gap:8px}
.pal{background:#fff;border:1px solid #d4dae2;width:58px;min-width:58px;height:52px;padding:8px 4px}
.pal.active{outline:3px solid #2563eb}
.pal.done{background:#dbeafe}
.result{padding:32px;text-align:center}
.stat{font-size:18px;line-height:2}
.review-card{margin-top:16px;padding:22px;text-align:left}
.review-q{font-size:20px;font-weight:700}
.review-option{padding:10px 12px;margin:7px 0;border-radius:8px;border:1px solid #ddd}
.review-option.correct{background:#dcfce7;border-color:#16a34a}
.review-option.wrong{background:#fee2e2;border-color:#dc2626}
@media(max-width:650px){
.container{padding:14px}
.home h1{font-size:26px}
.question{font-size:19px}
.quiz-header,.bottom{flex-direction:column;align-items:stretch}
.bottom button{margin:4px 0}
.pal{width:50px;min-width:50px;height:48px}
}
</style>
</head>
<body>
<div class="container">
<div id="home" class="card home">
<h1>📚 गति एवं दूरियों का मापन MCQ Practice</h1>
<div class="sub">Class 6 Physics • 150 MCQs • 5 Sections</div>
<div id="sectionsList"></div>
</div>

<div id="setup" class="card setup hidden">
<a href="#" class="back" onclick="goHome();return false;">← Back to Sections</a>
<h2 id="setupTitle"></h2>
<p class="sub" id="setupInfo"></p>
<div class="question-select-row">
<label><b>Questions:</b></label>
<select id="questionCount"></select>
</div>
<br><br>
<button class="next" onclick="startPractice()">🚀 Start Practice</button>
</div>

<div id="quiz" class="hidden">
<div class="quiz-topbar">
<button class="topics-back" onclick="goHome()">← Topics</button>
</div>
<div class="card quiz-header">
<strong id="sectionName"></strong>
<div id="counter"></div>
<div id="attempted"></div>
</div>

<div class="card question-card">
<div class="question" id="question"></div>
<div id="options"></div>
<div class="feedback" id="feedback"></div>
<div class="explanation hidden" id="explanation"></div>
</div>

<div class="card bottom">
<div>
<button class="prev" id="prevBtn">← Previous</button>
<button class="submit" id="checkBtn">Check Answer</button>
<button class="next" id="nextBtn">Next →</button>
</div>
<button class="submit" id="submitBtn">Submit Test</button>
</div>

<div class="card palette">
<h3>Question Palette</h3>
<div class="pal-grid" id="palette"></div>
</div>
</div>

<div id="result" class="card result hidden">
<h2>🎯 Test Result</h2>
<div class="stat" id="resultText"></div>
<br>
<button class="next" id="reviewBtn">👁️ Review Answers</button>
<button class="prev" id="homeBtn">Choose Section</button>
</div>
</div>

<script>
const questions=[{"id":1,"q":"हम किसी वस्तु को कब देख पाते हैं?","options":["जब वस्तु से प्रकाश हमारी आँखों तक पहुँचता है।","जब वस्तु पूर्ण अंधकार में होती है।","जब वस्तु प्रकाश को रोकती है।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"किसी वस्तु को देखने के लिए प्रकाश का हमारी आँखों तक पहुँचना आवश्यक है। केवल अंधकार में वस्तु को देखने की स्थिति नहीं बनती।"},{"id":2,"q":"जो वस्तुएँ स्वयं प्रकाश देती हैं, उन्हें क्या कहा जाता है?","options":["दीप्त वस्तुएँ (Luminous Objects)","अपारदर्शी वस्तुएँ","पारभासी वस्तुएँ","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"सूर्य और जलती हुई मोमबत्ती जैसी वस्तुएँ स्वयं प्रकाश देती हैं, इसलिए उन्हें दीप्त वस्तुएँ कहा जाता है।"},{"id":3,"q":"सूर्य किस प्रकार की वस्तु है?","options":["दीप्त वस्तु","पारदर्शी वस्तु","अपारदर्शी वस्तु","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"सूर्य स्वयं प्रकाश देता है। इसलिए वह दीप्त वस्तु का उदाहरण है।"},{"id":4,"q":"पारदर्शी वस्तुएँ (Transparent Objects) कैसी होती हैं?","options":["प्रकाश को अपने अंदर से गुजरने देती हैं।","प्रकाश को बिल्कुल नहीं गुजरने देतीं।","प्रकाश के केवल कुछ भाग को गुजरने देती हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"पारदर्शी वस्तुओं से प्रकाश गुजर सकता है और उनके दूसरी ओर रखी वस्तुएँ स्पष्ट दिखाई दे सकती हैं।"},{"id":5,"q":"अपारदर्शी वस्तुएँ (Opaque Objects) क्या करती हैं?","options":["प्रकाश को अपने अंदर से गुजरने नहीं देतीं।","प्रकाश को पूरी तरह गुजरने देती हैं।","केवल थोड़ी मात्रा में प्रकाश गुजराती हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"अपारदर्शी वस्तु प्रकाश को रोकती है। इसी कारण उसके पीछे छाया बनने की स्थिति उत्पन्न हो सकती है।"},{"id":6,"q":"पारभासी वस्तुएँ (Translucent Objects) क्या करती हैं?","options":["प्रकाश के कुछ भाग को अपने अंदर से गुजरने देती हैं।","प्रकाश का कोई भाग नहीं गुजरने देतीं।","प्रकाश को पूरी तरह स्पष्ट रूप से गुजरने देती हैं।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"पारभासी वस्तुओं से प्रकाश का कुछ भाग गुजरता है, इसलिए उनके पीछे की वस्तु स्पष्ट रूप से नहीं दिखाई देती।"},{"id":7,"q":"वस्तुओं का पारदर्शी, अपारदर्शी या पारभासी होना किस पर निर्भर करता है?","options":["उनसे होकर गुजरने वाले प्रकाश की मात्रा पर।","केवल उनके रंग पर।","केवल उनके आकार पर।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"अध्याय में वस्तुओं का वर्गीकरण इस आधार पर किया गया है कि उनसे होकर प्रकाश कितना गुजरता है।"},{"id":8,"q":"छाया बनने के लिए प्रकाश के मार्ग में किस प्रकार की वस्तु आनी चाहिए?","options":["अपारदर्शी वस्तु","पारदर्शी वस्तु","पारभासी वस्तु","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"जब प्रकाश के मार्ग में अपारदर्शी वस्तु आती है और प्रकाश रुकता है, तब छाया बनती है।"},{"id":9,"q":"छाया को देखने के लिए किसकी आवश्यकता होती है?","options":["पर्दे या सतह की","केवल अंधकार की","केवल पारदर्शी वस्तु की","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"छाया पर्दे या किसी सतह पर दिखाई देती है। जमीन, दीवार और भवन की सतह भी पर्दे की तरह कार्य कर सकती है।"},{"id":10,"q":"निम्न में से कौन पर्दे की तरह कार्य कर सकता है?","options":["दीवार","जमीन","भवन की सतह","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"अध्याय में जमीन, कमरे की दीवार, इमारत आदि सतहों को छाया देखने के लिए पर्दे के समान बताया गया है।"},{"id":11,"q":"केवल छाया से वस्तु के बारे में क्या जानकारी मिल सकती है?","options":["उसकी आकृति के बारे में","हमेशा उसका वास्तविक रंग","हमेशा उसकी पूरी पहचान","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"छाया वस्तु की आकृति के बारे में कुछ जानकारी देती है, लेकिन कभी-कभी वह वास्तविक वस्तु के बारे में भ्रम भी पैदा कर सकती है।"},{"id":12,"q":"हाथों से बनाए गए जानवरों की आकृतियाँ किससे संबंधित हैं?","options":["छाया से उत्पन्न भ्रम से","पारदर्शिता से","परावर्तन से","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"हाथों की स्थिति बदलकर विभिन्न जानवरों जैसी छायाएँ बनाई जा सकती हैं। इससे केवल छाया देखकर वस्तु की वास्तविक आकृति के बारे में भ्रम हो सकता है।"},{"id":13,"q":"प्रकाश किस प्रकार की रेखा में गमन करता है?","options":["सरल रेखा में","केवल वक्र रेखा में","वृत्ताकार पथ में","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"अध्याय में गतिविधियों के माध्यम से निष्कर्ष निकाला गया है कि प्रकाश सरल रेखा में गमन करता है।"},{"id":14,"q":"मोमबत्ती को मुड़ी हुई नली से देखने पर क्या होता है?","options":["मोमबत्ती दिखाई नहीं देती।","मोमबत्ती और स्पष्ट दिखाई देती है।","मोमबत्ती का प्रकाश वक्र हो जाता है।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"प्रकाश सरल रेखा में चलता है। इसलिए मुड़ी हुई नली के माध्यम से प्रकाश का सीधा मार्ग आँख तक नहीं बन पाता।"},{"id":15,"q":"पिनहोल कैमरा (Pinhole Camera) किससे बनाया जा सकता है?","options":["साधारण सामग्री से","केवल महँगे कैमरा उपकरणों से","केवल दर्पण से","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"अध्याय में बताया गया है कि साधारण सामग्री से सरल पिनहोल कैमरा बनाया जा सकता है।"},{"id":16,"q":"पिनहोल कैमरे में पर्दे के रूप में किसका प्रयोग किया जा सकता है?","options":["ट्रेसिंग पेपर","लोहे की मोटी प्लेट","अपारदर्शी दीवार","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"पिनहोल कैमरे में ट्रेसिंग पेपर को पारभासी पर्दे के रूप में लगाया जाता है।"},{"id":17,"q":"पिनहोल कैमरे में वस्तु का प्रतिबिंब कैसा दिखाई दे सकता है?","options":["उल्टा","हमेशा सीधा","केवल रंगहीन","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"पिनहोल कैमरे में वस्तु का प्रतिबिंब उल्टा दिखाई देता है।"},{"id":18,"q":"पत्तियों के बीच के खाली स्थान किसकी तरह व्यवहार कर सकते हैं?","options":["पिनहोल की तरह","दर्पण की तरह","पर्दे की तरह हमेशा","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0 ासी पर्दे के रूप में लगाया जाता है, जिस पर छवि देखी जाती है।"},{"id":141,"q":"किसी छात्र ने पिनहोल कैमरे से सड़क पर चलती वस्तुओं को देखा। वह वस्तुओं की छवि को सीधी या उल्टी देखकर आश्चर्यचकित हुआ। इस प्रयोग का संबंध किससे है?","options":["पिनहोल से बनने वाली छवि से","केवल छाया के रंग से","केवल दर्पण के परावर्तन से","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"पिनहोल कैमरे से दूर की वस्तुओं की छवि देखी जा सकती है और अध्याय इस छवि के सीधी/उल्टी होने का निरीक्षण कराता है।"},{"id":142,"q":"एक बच्चा कमरे में टॉर्च बंद करके किसी वस्तु की छाया खोजता है लेकिन उसे नहीं मिलती। वह टॉर्च जलाता है और वस्तु की छाया दिखाई देती है। इसका कारण क्या है?","options":["छाया बनने के लिए प्रकाश आवश्यक है।","अंधकार में प्रकाश अधिक होता है।","वस्तु प्रकाश स्रोत बन गई।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"बिना प्रकाश के प्रकाश-रोकने की प्रक्रिया नहीं होगी। टॉर्च जलने पर अपारदर्शी वस्तु प्रकाश के रास्ते में आकर छाया बनाती है।"},{"id":143,"q":"एक शिक्षक ने तीन वस्तुएँ दीं—एक पारदर्शी, एक पारभासी और एक अपारदर्शी। उनका वर्गीकरण किस आधार पर किया जाएगा?","options":["उनसे होकर गुजरने वाले प्रकाश की मात्रा के आधार पर।","केवल उनकी लंबाई के आधार पर।","केवल उनके रंग के आधार पर।","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"NCERT में इन तीन प्रकारों का वर्गीकरण वस्तु से होकर गुजरने वाले प्रकाश की मात्रा के आधार पर किया गया है।"},{"id":144,"q":"एक बच्चा कागज की शीट के पीछे रखी वस्तु को स्पष्ट रूप से नहीं देख पा रहा है, लेकिन कुछ प्रकाश दूसरी ओर पहुँच रहा है। कागज किस प्रकार का व्यवहार कर सकता है?","options":["पारभासी","पारदर्शी","पूर्णतः अपारदर्शी","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"यदि कुछ प्रकाश गुजर रहा है लेकिन दूसरी ओर की वस्तु स्पष्ट नहीं दिखाई देती, तो यह पारभासी व्यवहार के अनुरूप है।"},{"id":145,"q":"एक छात्र ने कहा, “यदि छाया बन रही है तो वस्तु निश्चित रूप से प्रकाश को रोक रही है।” इस कथन का मूल्यांकन करें।","opti ","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":0,"explanation":"छाया के लिए अपारदर्शी वस्तु का प्रकाश के मार्ग में होना आवश्यक है। उसे हटाने पर प्रकाश पर्दे तक पहुँच सकता है और छाया क्षेत्र समाप्त हो जाता है।"},{"id":150,"q":"एक शिक्षक पूरे अध्याय का निष्कर्ष पूछता है। निम्न में से कौन-सा समूह अध्याय के मुख्य विचारों को सबसे अच्छी तरह दर्शाता है?","options":["पारदर्शी/अपारदर्शी/पारभासी वस्तुएँ, छाया और प्रकाश का सरल रेखीय गमन","दर्पण और परावर्तन","पिनहोल कैमरा और प्रकाश की सीधी गति","उपर्युक्त में से एक से अधिक सही हैं।","इनमें से कोई नहीं।"],"answer":3,"explanation":"अध्याय में वस्तुओं द्वारा प्रकाश के संचरण, छाया, पिनहोल कैमरा, प्रकाश के सरल रेखीय गमन तथा दर्पण-परावर्तन सभी प्रमुख अवधारणाएँ शामिल हैं। NCERT के सारांश में इन्हीं मुख्य बिंदुओं को समेटा गया है।"}]
const sections=[{"name":"Section A — Basic / Direct NCERT Questions","start":1,"end":35},{"name":"Section B — Concept Based Questions","start":36,"end":70},{"name":"Section C — Statement Based Questions","start":71,"end":105},{"name":"Section D — Assertion–Reason Questions","start":106,"end":125},{"name":"Section E — Case / Scenario Based Questions","start":126,"end":150}];

let selectedSection=null;
let quiz=[];
let currentIndex=0;
let answers={};
let checked={};
let reviewMode=false;

function goHome(){
 document.getElementById("home").classList.remove("hidden");
 document.getElementById("setup").classList.add("hidden");
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 selectedSection=null;quiz=[];currentIndex=0;answers={};checked={};reviewMode=false;
 window.scrollTo(0,0);
}

function renderSections(){
 const box=document.getElementById("sectionsList");
 box.innerHTML="";
 sections.forEach((s,i)=>{
  const d=document.createElement("div");
  d.className="section";
  d.innerHTML=`<div class="section-title">${s.name}</div><div class="section-count">${s.end-s.start+1} Questions</div>`;
  d.onclick=()=>startSection(i);
  box.appendChild(d);
 });
}

function startSection(i){
 selectedSection=sections[i];
 const list=questions.slice(selectedSection.start-1,selectedSection.end);
 document.getElementById("home").classList.add("hidden");
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.add("hidden");
 document.getElementById("setup").classList.remove("hidden");

 document.getElementById("setupTitle").textContent=selectedSection.name;
 document.getElementById("setupInfo").textContent=`${list.length} MCQs available`;

 const sel=document.getElementById("questionCount");
 sel.innerHTML="";
 [5,10,20,list.length].forEach(n=>{
  if(n<=list.length && !Array.from(sel.options).some(o=>Number(o.value)===n)){
   const o=document.createElement("option");
   o.value=n;
   o.textContent=n===list.length?`All ${n} Questions`:`${n} Questions`;
   sel.appendChild(o);
  }
 });
 // IMPORTANT: default हमेशा पूरे section की question count रहेगी
 sel.value=String(list.length);
 window.scrollTo(0,0);
}

function startPractice(){
 const list=questions.slice(selectedSection.start-1,selectedSection.end)
   .map((q,i)=>({...q,_id:selectedSection.start+i}));
 const count=Number(document.getElementById("questionCount").value);

 quiz=list.slice(0,count);
 currentIndex=0;
 answers={};
 checked={};
 reviewMode=false;

 document.getElementById("setup").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 render();
 window.scrollTo(0,0);
}

function render(){
 const q=quiz[currentIndex];
 if(!q)return;

 document.getElementById("sectionName").textContent=selectedSection.name;
 document.getElementById("counter").textContent=`Question ${currentIndex+1} of ${quiz.length}`;
 document.getElementById("attempted").textContent=`Attempted: ${Object.keys(answers).length}/${quiz.length}`;
 document.getElementById("question").textContent=`Q${q._id}. ${q.q}`;

 const box=document.getElementById("options");
 box.innerHTML="";
 document.getElementById("feedback").textContent="";
 document.getElementById("explanation").classList.add("hidden");
 document.getElementById("explanation").innerHTML="";

 q.options.forEach((opt,i)=>{
  const b=document.createElement("button");
  b.type="button";
  b.className="option";
  b.innerHTML=`<b>${String.fromCharCode(65+i)}.</b> ${opt}`;

  const selected=answers[q._id];
  if(selected===i)b.classList.add("selected");

  if(checked[q._id] || reviewMode){
   b.disabled=true;
   if(i===q.answer)b.classList.add("correct");
   if(selected===i && i!==q.answer)b.classList.add("wrong");
  }else{
   b.onclick=()=>{
    answers[q._id]=i;
    render();
   };
  }
  box.appendChild(b);
 });

 if(checked[q._id] || reviewMode){
  const f=document.getElementById("feedback");
  if(selectedAnswerExists(q)){
   f.textContent=answers[q._id]===q.answer
     ?"✅ सही उत्तर!"
     :`❌ गलत। सही उत्तर: ${String.fromCharCode(65+q.answer)}`;
   f.style.color=answers[q._id]===q.answer?"#15803d":"#b91c1c";
  }else{
   f.textContent=`⚪ Unattempted. सही उत्तर: ${String.fromCharCode(65+q.answer)}`;
   f.style.color="#536579";
  }

  document.getElementById("explanation").innerHTML=
    `<div class="explanation-title">💡 Explanation</div>${formatExplanation(q.explanation)}`;
  document.getElementById("explanation").classList.remove("hidden");
 }

 renderPalette();
 document.getElementById("prevBtn").disabled=currentIndex===0;
 document.getElementById("nextBtn").disabled=currentIndex===quiz.length-1;
 document.getElementById("checkBtn").disabled=reviewMode || !!checked[q._id] || answers[q._id]===undefined;
 document.getElementById("submitBtn").style.display=reviewMode?"none":"inline-block";
}

function selectedAnswerExists(q){
 return answers[q._id]!==undefined;
}

function formatExplanation(s){
 return s.replace(/\n/g,"<br>");
}

function renderPalette(){
 const p=document.getElementById("palette");
 p.innerHTML="<h3>Question Palette</h3>";
 const g=document.createElement("div");
 g.className="pal-grid";

 quiz.forEach((q,i)=>{
  const b=document.createElement("button");
  b.className="pal";
  b.type="button";
  b.textContent=q._id;
  if(i===currentIndex)b.classList.add("active");
  if(answers[q._id]!==undefined)b.classList.add("done");
  b.onclick=()=>{
   currentIndex=i;
   render();
   window.scrollTo(0,0);
  };
  g.appendChild(b);
 });
 p.appendChild(g);
}

document.getElementById("prevBtn").onclick=()=>{
 if(currentIndex>0){
  currentIndex--;
  render();
  window.scrollTo(0,0);
 }
};

document.getElementById("nextBtn").onclick=()=>{
 if(currentIndex<quiz.length-1){
  currentIndex++;
  render();
  window.scrollTo(0,0);
 }
};

document.getElementById("checkBtn").onclick=()=>{
 const q=quiz[currentIndex];
 if(answers[q._id]===undefined)return;
 checked[q._id]=true;
 render();
};

document.getElementById("submitBtn").onclick=()=>{
 if(confirm("क्या आप अपना test submit करना चाहते हैं?"))showResult();
};

function showResult(){
 let correct=0,attempted=Object.keys(answers).length;
 quiz.forEach(q=>{
  if(answers[q._id]===q.answer)correct++;
 });
 let wrong=Object.keys(answers).filter(id=>{
  const q=quiz.find(x=>String(x._id)===String(id));
  return q && answers[id]!==q.answer;
 }).length;

 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");

 document.getElementById("resultText").innerHTML=
 `<div><b>Score:</b> ${correct} / ${quiz.length}</div>
  <div>🟢 Correct: ${correct}</div>
  <div>🔴 Wrong: ${wrong}</div>
  <div>⚪ Unattempted: ${quiz.length-attempted}</div>
  <div>📊 Attempted: ${attempted}</div>`;

 window.scrollTo(0,0);
}

document.getElementById("reviewBtn").onclick=()=>{
 reviewMode=true;
 currentIndex=0;
 document.getElementById("result").classList.add("hidden");
 document.getElementById("quiz").classList.remove("hidden");
 render();
 window.scrollTo(0,0);
};

// Keyboard shortcuts: N = Next, P = Previous
document.addEventListener("keydown", (e)=>{
  const tag = document.activeElement?.tagName;
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

  const key = e.key.toLowerCase();

  if(key === "n" && currentIndex < quiz.length - 1){
    e.preventDefault();
    currentIndex++;
    render();
    window.scrollTo(0,0);
  }

  if(key === "p" && currentIndex > 0){
    e.preventDefault();
    currentIndex--;
    render();
    window.scrollTo(0,0);
  }
});

document.getElementById("homeBtn").onclick=goHome;

renderSections();
</script>
</body>
</html>
