<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Computer Science Notes + MCQ</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* Site logout button: same size/style as the existing Login button */
        .logout-btn {
            padding: 10px 20px;
            height: 40px;
            border: none;
            border-radius: 6px;
            background: #2864e6;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-sizing: border-box;
        }

        .logout-btn:hover {
            background: #1f56cc;
        }
    </style>
</head>

<body>

<header class="header">

    <div
        class="logo"
        onclick="goHome()"
    >
        📚
        <span>
            Computer Science Notes + MCQ
        </span>
    </div>


    <nav>

        <a
            href="#"
            onclick="goHome()"
        >
            Home
        </a>


        <a href="#science">
            Computer Science
        </a>


        <a href="#about">
            About
        </a>

    </nav>


    <div class="header-actions">

        <input
            type="text"
            id="searchInput"
            placeholder="Search chapters, topics..."
        >


        <button
            class="login-btn"
            onclick="location.href='admin/index.html'"
        >
            Login
        </button>


        <button
            class="logout-btn"
            onclick="logoutSite()"
        >
            Logout
        </button>

    </div>

</header>


<main id="app"></main>


<footer class="footer">

    © 2026 Computer Science Notes + MCQ
    | Learn • Practice • Improve

</footer>


<script>
async function logoutSite() {
    try {
        const response = await fetch("/api/cs-site-logout", {
            method: "POST",
            credentials: "same-origin"
        });

        if (response.ok) {
            window.location.href = "/";
        } else {
            alert("Logout failed. Please try again.");
        }
    } catch (error) {
        alert("Logout failed. Please try again.");
    }
}
</script>


<script src="js/app.js?v=20261008"></script>

<script src="js/quiz.js"></script>

<!-- Computer Science Subject → Main Topic → Subtopic → MCQ hierarchy -->
<script src="js/cs-hierarchy.js"></script>


</body>
</html>
